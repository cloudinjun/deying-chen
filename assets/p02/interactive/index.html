<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDT Goggles · Configurator</title>
<style>
  /* 左栏：一种字号体系、一种按钮、无徽标无彩色；右侧视口白底 */
  :root { --line:#e6e6e6; --text:#111; --muted:#8a8a8a; --ok:#1a7f37; --bad:#b42318; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#fff; color:var(--text);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; font-size:12px; line-height:1.4; font-variant-numeric:tabular-nums; }
  #app { display:grid; grid-template-columns:272px 1fr; height:100%; }
  #panel { border-right:1px solid var(--line); overflow-y:auto; display:flex; flex-direction:column; }
  #panel header { padding:18px 18px 14px; display:flex; justify-content:space-between; align-items:baseline; }
  #panel h1 { font-size:11px; font-weight:600; letter-spacing:.14em; margin:0; }
  #panel .badge { font-size:9px; letter-spacing:.14em; color:var(--muted); }
  #panel .badge::before { content:""; display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--ok); margin-right:6px; vertical-align:1px; }
  .group { border-top:1px solid var(--line); padding:12px 18px 14px; }
  .group > button { all:unset; display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding:0 0 8px; cursor:default; }
  .group .body { display:block; }
  .row { display:flex; align-items:center; justify-content:space-between; min-height:28px; gap:10px; }
  .row label { display:flex; align-items:center; gap:9px; cursor:pointer; }
  .row input[type=checkbox] { width:12px; height:12px; margin:0; accent-color:#111; }
  .swatch { width:8px; height:8px; border-radius:50%; border:1px solid rgba(0,0,0,.12); flex:none; }
  .row .lbl { color:var(--muted); }
  /* 数字条：一条线 + 真实存在的刻度 + 圆点，右边是数值；拖动吸附到最近的真实变体 */
  .nbar { display:flex; align-items:center; gap:10px; width:128px; flex:none; }
  .nbar-track { position:relative; flex:1; height:18px; cursor:ew-resize; touch-action:none; }
  .nbar-track::before { content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--line); }
  .nbar-ticks span { position:absolute; top:50%; width:1px; height:5px; margin-top:-2px; background:var(--muted); }
  .nbar-thumb { position:absolute; top:50%; width:9px; height:9px; margin:-4.5px 0 0 -4.5px; background:#111; border-radius:50%; }
  .nbar-val { font-variant-numeric:tabular-nums; min-width:42px; text-align:right; }
  select.btn { font:inherit; font-size:11px; border:1px solid var(--line); background:#fff; color:var(--text); padding:3px 6px; border-radius:2px; max-width:150px; }
  /* 自定义下拉：原生 select 隐藏只当取值用；展开列表画在页面里，录屏时能看到选项 */
  select.dd-native { display:none; }
  .dd { position:relative; flex:none; }
  .dd-btn { font:inherit; font-size:11px; border:1px solid var(--line); background:#fff; color:var(--text); padding:3px 22px 3px 8px; border-radius:2px;
    cursor:pointer; max-width:160px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; position:relative; min-width:64px; }
  .dd-btn::after { content:""; position:absolute; right:8px; top:50%; width:5px; height:5px; border-right:1px solid var(--muted); border-bottom:1px solid var(--muted); transform:translateY(-70%) rotate(45deg); }
  .dd-btn:hover, .dd.open .dd-btn { border-color:#111; }
  .dd-list { position:absolute; right:0; top:calc(100% + 3px); min-width:100%; background:#fff; border:1px solid #111; border-radius:2px; z-index:30; display:none; padding:3px 0; }
  .dd.open .dd-list { display:block; }
  .dd-list div { padding:5px 10px 5px 18px; font-size:11px; white-space:nowrap; cursor:pointer; color:var(--text); position:relative; }
  .dd-list div:hover, .dd-list div.hover { background:#f3f3f3; }
  .dd-list div.sel::before { content:""; position:absolute; left:8px; top:50%; width:4px; height:4px; border-radius:50%; background:#111; transform:translateY(-50%); }
  /* 演示光标：页内画一个箭头，按编排移动 / 点击，录屏时真实鼠标不画 */
  #cursor { position:fixed; left:0; top:0; z-index:100; pointer-events:none; display:none; will-change:transform; }
  body.demo #cursor { display:block; }
  body.demo.nocursor #cursor { display:none; }
  #sp-seal.pulse { animation:pulse 1.2s ease-in-out 2; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
  #cursor svg { display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  #cursor .ring { position:absolute; left:-10px; top:-10px; width:22px; height:22px; border-radius:50%; border:2px solid #111; opacity:0; }
  #cursor.click .ring { animation:ring .45s ease-out; }
  @keyframes ring { 0% { opacity:.7; transform:scale(.4); } 100% { opacity:0; transform:scale(1.7); } }
  .btn { font:inherit; font-size:11px; border:1px solid #cfcfcf; background:#fff; color:var(--text); padding:6px 10px; border-radius:2px; cursor:pointer; }
  .btn:hover { border-color:#111; }
  .btn.dark { background:#111; color:#fff; border-color:#111; }
  .btn.link { border:0; padding:0; color:var(--muted); text-decoration:underline; text-underline-offset:2px; background:none; }
  .btn.link:hover { color:var(--text); }
  .actions { display:flex; gap:6px; margin-top:10px; }
  .actions .btn { flex:1; }
  .kv { display:flex; justify-content:space-between; gap:12px; min-height:26px; align-items:baseline; color:var(--muted); }
  .kv b { color:var(--text); font-weight:500; text-align:right; }
  .kv[hidden] { display:none; }   /* .kv 的 flex 会盖过 hidden 属性，显式关掉 */
  details { margin-top:6px; }
  summary { font-size:10px; color:var(--muted); cursor:pointer; letter-spacing:.06em; text-transform:uppercase; }
  #seal-detail { color:var(--muted); font-size:10px; line-height:1.5; white-space:pre-line; padding-top:6px; }
  #status { padding:0 18px 10px; color:var(--muted); font-size:10px; }
  #footer { margin-top:auto; border-top:1px solid var(--line); padding:12px 18px 14px; display:flex; gap:16px; }
  #stage { position:relative; overflow:hidden; min-width:0; }
  canvas { display:block; }
  #readout { position:absolute; top:14px; left:50%; transform:translateX(-50%); border:1px solid var(--line); background:rgba(255,255,255,.92);
    border-radius:2px; padding:6px 12px; font-size:10.5px; letter-spacing:.06em; color:var(--muted); white-space:nowrap; }
  #readout b { color:var(--text); font-weight:600; margin:0 2px; }
  #views { position:absolute; top:14px; right:14px; display:flex; flex-direction:column; border:1px solid var(--line); background:rgba(255,255,255,.92); border-radius:2px; }
  #views button { font:inherit; font-size:10.5px; border:0; background:none; padding:6px 12px; cursor:pointer; color:var(--muted); text-align:left; }
  #views button:hover { color:var(--text); }
  #views button.on { color:var(--text); background:#f3f3f3; }
  #hint, #sig { position:absolute; bottom:12px; color:var(--muted); font-size:10px; letter-spacing:.06em; }
  #hint { left:14px; } #sig { right:14px; }
  /* 压力图图例：一条色带 + 两端数值；悬停读数跟着光标；支撑落点标签按三维位置投影 */
  #legend { position:absolute; left:14px; bottom:12px; display:flex; align-items:center; gap:8px; font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; }
  #legend .bar { width:120px; height:6px; border-radius:1px; background:linear-gradient(90deg,#3b4cc0,#8db0fe,#dddddd,#f49a7b,#b40426); }
  #legend b { color:var(--text); font-weight:500; }
  #legend .sub, .tag .sub, #probe .sub { color:var(--muted); font-size:10px; margin-left:6px; }
  .lv { font-weight:600; } .lv-sensitive { color:#3b4cc0; } .lv-moderate { color:#7a7a7a; } .lv-tolerant { color:#b40426; }
  #probe .lv-sensitive { color:#9db8ff; } #probe .lv-moderate { color:#d8d8d8; } #probe .lv-tolerant { color:#ff9a86; }
  #legend .lv-sensitive, #legend .lv-tolerant { font-weight:600; }
  #probe .sub { color:#bbb; }
  #probe { position:absolute; left:0; top:0; pointer-events:none; display:none; background:#111; color:#fff; font-size:11px; padding:3px 7px; border-radius:2px; white-space:nowrap; transform:translate(14px,-28px); font-variant-numeric:tabular-nums; }
  #probe.on { display:block; }
  #tags, #probetags { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  /* 解释环节的字幕：一行，舞台底部居中，淡入淡出 */
  #caption { position:absolute; left:50%; bottom:44px; transform:translateX(-50%); max-width:70%; text-align:center; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
    letter-spacing:.01em; opacity:0; transition:opacity .35s; pointer-events:none; white-space:nowrap; }
  #caption.on { opacity:1; }
  #curtain { position:absolute; inset:0; background:#fff; z-index:200; display:none; }
  body.predemo #curtain { display:block; }
  body.thumb #caption { display:none; }
  .tag { position:absolute; left:0; top:0; font-size:10.5px; color:var(--text); background:rgba(255,255,255,.88); border:1px solid var(--line); padding:1px 5px; border-radius:2px; white-space:nowrap; transform:translate(10px,-50%); font-variant-numeric:tabular-nums; }
  .tag.off { display:none; }
  .tag.zone { font-size:11.5px; padding:2px 7px; }
  /* 五官点是几何读数，不是数据：深底白字、小号大写、标在点正下方，和白底的 PDT 词区分开 */
  /* 五官 callout：白底、按特征色描边和文字，位置由引线另一端决定（居中对齐） */
  .tag.landmark { background:rgba(255,255,255,.96); color:#111; border:1px solid #111; border-radius:0; font-size:9px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; padding:2px 6px; transform:translate(-50%, -50%); }
  #leaders { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  #leaders line { stroke-width:1; }
  body.thumb #legend, body.thumb #tags, body.thumb #probe { display:none; }
  /* 加载进度：顶部一条细线 + 左栏在加载完成前不可点 */
  #progress { position:absolute; top:0; left:0; height:2px; width:0; background:#111; transition:width .2s; z-index:5; }
  body.loading #panel { pointer-events:none; opacity:.55; }
  body.loading #views, body.loading #readout { opacity:.35; }
  #toast { position:absolute; left:50%; bottom:40px; transform:translateX(-50%); background:#111; color:#fff; font-size:11px; padding:6px 12px; border-radius:2px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.on { opacity:1; }
  body.demo #sig, body.demo #views, body.demo #toast, body.demo #legend, body.demo #panel, body.demo #readout { display:none; }
  .tag.grid { background:none; border:none; font-size:11px; color:var(--muted); transform:translate(-50%, -50%); letter-spacing:.02em; }
  body.demo #app { grid-template-columns:1fr; }
  /* 缩略图模式（作品集页 ?thumb=1）：只留三维视图，面板与控件全部隐藏 */
  body.thumb #panel, body.thumb #views, body.thumb #readout, body.thumb #toast { display:none; }
  body.thumb #app { grid-template-columns:1fr; grid-template-rows:1fr; }
  @media (max-width:760px) {
    #app { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    #panel { max-height:44vh; border-right:0; border-bottom:1px solid var(--line); }
    .group { padding:10px 16px 12px; }
    .row { min-height:34px; }            /* 触控目标 */
    .row input[type=checkbox] { width:16px; height:16px; }
    select.btn, .btn { font-size:12px; padding:6px 8px; }
    #readout { font-size:10px; padding:5px 8px; top:10px; }
    #views { top:10px; right:10px; }
    #views button { padding:8px 12px; }
  }
  #gridwrap { position:absolute; inset:0; background:rgba(255,255,255,.97); display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px; }
  #gridwrap.on { display:flex; }
  #gridwrap canvas { max-width:100%; max-height:calc(100% - 44px); border:1px solid var(--line); background:#fff; }
  #gridwrap .bar { display:flex; gap:8px; }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>
      <h1>PDT GOGGLES</h1>
    </header>

    <div class="group open" id="g-head">
      <div class="body">
        <div class="row"><span class="lbl">PDT map</span>
          <select id="sel-map" class="btn">
            <option value="female" selected>Female mean</option>
            <option value="mean">All mean</option>
            <option value="male">Male mean</option>
            <option value="p20">Participant 20</option>
            <option value="p15">Participant 15</option>
          </select></div>
        <div class="row"><label><input type="checkbox" id="chk-headsolid" checked> Head</label><span class="swatch" style="background:#e3e6ea"></span></div>
        <div class="row"><label><input type="checkbox" id="chk-pdt" checked> Pressure map</label><span class="swatch" style="background:#b40426"></span></div>
        <div class="row"><label><input type="checkbox" id="chk-anchors" checked> Anchors</label><span class="swatch" style="background:#111"></span></div>
        <div class="row"><label><input type="checkbox" id="chk-head"> Scan points</label><span class="swatch" style="background:#7d8a99"></span></div>
      </div>
    </div>

    <div class="group open" id="g-variant">
      <div class="body">
        <div class="row"><span class="lbl">Back support</span>
          <select id="sel-pos" class="btn">
            <option value="low">low</option>
            <option value="mid" selected>mid</option>
            <option value="high">high</option>
          </select></div>
        <div class="row"><span class="lbl">Supports</span>
          <div class="nbar" id="nb-count"><div class="nbar-track"><div class="nbar-ticks"></div><div class="nbar-thumb"></div></div><span class="nbar-val">6</span></div></div>
        <div class="row"><span class="lbl">Spacing</span>
          <div class="nbar" id="nb-dist"><div class="nbar-track"><div class="nbar-ticks"></div><div class="nbar-thumb"></div></div><span class="nbar-val">90 mm</span></div></div>
        <div class="actions"><button class="btn" id="btn-grid">All 9</button><button class="btn" id="btn-sheet">Sheet</button></div>
      </div>
    </div>

    <div class="group open" id="g-parts">
      <div class="body">
        <div class="row"><label><input type="checkbox" id="chk-frame" checked> Frame</label><button class="btn link" id="btn-export">STL</button></div>
        <div class="row"><span></span>
          <select id="finish" class="btn">
            <option value="matte">matte black</option>
            <option value="soft">soft grey</option>
            <option value="metal">bronze</option>
          </select></div>
        <div class="row"><label><input type="checkbox" id="chk-lens" checked> Lens</label><button class="btn link" id="btn-export-lens">STL</button></div>
        <div class="row"><span></span>
          <select id="tint" class="btn">
            <option value="smoke">smoke</option>
            <option value="mirror">mirror</option>
            <option value="clear">clear</option>
          </select></div>
        <div class="row"><label><input type="checkbox" id="chk-seal"> Seal ring</label><span class="swatch" style="background:#3a3a3a"></span></div>
        <div class="row"><label><input type="checkbox" id="chk-overlay"> Seal check</label><span class="swatch" style="background:var(--ok)"></span></div>
        <div class="row"><label><input type="checkbox" id="chk-ref"> May 2026 reference</label><span class="swatch" style="background:#c9a27a"></span></div>
      </div>
    </div>

    <div class="group open" id="g-specs">
      <div class="body" id="specs">
        <div class="kv"><span>Lens</span><b id="sp-lens">—</b></div>
        <div class="kv"><span>Mass</span><b id="sp-mass">—</b></div>
        <div class="kv"><span>Seal check</span><b id="sp-seal">—</b></div>
        <div class="kv" hidden><span>Overall</span><b id="sp-overall">—</b></div>
        <div class="kv" hidden><span>Lens blank</span><b id="sp-blank">cylindrical · base 6</b></div>
        <div class="kv" hidden><span>Base curve</span><b id="sp-base">—</b></div>
        <div class="kv" hidden><span>Lens edge</span><b id="sp-edge">—</b></div>
        <details><summary>report</summary><div id="seal-detail"></div></details>
        <span id="sp-faces" hidden></span>
      </div>
    </div>

    <div id="status" hidden>loading…</div>
    <div id="footer">
      <button class="btn link" id="btn-reset" title="R">Reset</button>
      <button class="btn link" id="btn-save" title="Save the current view as PNG">Save image</button>
      <button class="btn link" id="btn-copy" title="Copy the spec lines">Copy specs</button>
      <button class="btn link" id="btn-share" title="Copy a link that opens this exact configuration">Share</button>
    </div>
  </aside>

  <main id="stage">
    <div id="readout"><b id="ro-w">—</b> × <b id="ro-h">—</b> × <b id="ro-d">—</b> mm</div>
    <div id="views">
      <button data-view="iso" class="on">Iso</button>
      <button data-view="front">Front</button>
      <button data-view="top">Top</button>
      <button data-view="side">Side</button>
    </div>
    <div id="progress"></div>
    <div id="sig">DEYING CHEN</div>
    <div id="legend"><span class="lv-sensitive">sensitive</span><span class="bar"></span><span class="lv-tolerant">tolerant</span></div>
    <div id="probe"></div>
    <div id="tags"></div>
    <div id="probetags"></div>
    <div id="caption"></div>
    <div id="curtain"></div>
    <div id="toast"></div>
    <div id="cursor"><div class="ring"></div><svg width="18" height="26" viewBox="0 0 18 26"><path d="M1.5 1.5 L1.5 20.5 L6.2 16.2 L9.6 24 L12.6 22.7 L9.3 15 L15.8 15 Z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
    <div id="gridwrap">
      <canvas id="gridcanvas"></canvas>
      <div class="bar"><button class="btn" id="btn-grid-save">Save grid</button><button class="btn" id="btn-grid-close">Close</button></div>
    </div>
  </main>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { STLExporter } from "three/addons/exporters/STLExporter.js";
import * as BufferGeometryUtils from "three/addons/utils/BufferGeometryUtils.js";
import { Line2 } from "three/addons/lines/Line2.js";
import { LineMaterial } from "three/addons/lines/LineMaterial.js";
import { LineGeometry } from "three/addons/lines/LineGeometry.js";
import { LineSegments2 } from "three/addons/lines/LineSegments2.js";
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js";

// ---------- 场景 ----------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// 柔和的主光 + 补光，环境贴图负责反射
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(-200, -400, 300); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(300, -200, 100); scene.add(fill);
scene.add(new THREE.HemisphereLight(0xffffff, 0xdddddd, 0.6));

// 模型坐标：X 左右、Y 前后（脸朝 -Y）、Z 上。three.js 默认 Y 上，所以把整个组转成 Z 上
const root = new THREE.Group();
root.rotation.x = -Math.PI / 2;   // Z-up → Y-up
scene.add(root);

// ---------- 材质 ----------
const finishes = {
  matte: new THREE.MeshPhysicalMaterial({ color: 0x1c1c1c, roughness: 0.62, metalness: 0.0, clearcoat: 0.15, clearcoatRoughness: 0.5 }),
  soft:  new THREE.MeshPhysicalMaterial({ color: 0x5a5a5a, roughness: 0.85, metalness: 0.0 }),
  metal: new THREE.MeshPhysicalMaterial({ color: 0x8a6a4a, roughness: 0.35, metalness: 0.9 }),
};
// 镜片三种材质：烟灰 / 镜面 / 透明
const lensMats = {
  smoke:  new THREE.MeshPhysicalMaterial({ color: 0x263445, roughness: 0.08, metalness: 0.0, transmission: 0.45, thickness: 2.0, ior: 1.5,
    transparent: true, opacity: 0.92, side: THREE.DoubleSide, clearcoat: 1.0, clearcoatRoughness: 0.05 }),
  mirror: new THREE.MeshPhysicalMaterial({ color: 0x9fb3c8, roughness: 0.05, metalness: 0.85, transmission: 0.0,
    side: THREE.DoubleSide, clearcoat: 1.0, clearcoatRoughness: 0.03 }),
  clear:  new THREE.MeshPhysicalMaterial({ color: 0xdfe7ee, roughness: 0.05, metalness: 0.0, transmission: 0.92, thickness: 2.0, ior: 1.5,
    transparent: true, opacity: 1.0, side: THREE.DoubleSide, clearcoat: 1.0, clearcoatRoughness: 0.03 }),
};

  const colorA = await headColorsFor(mapKey0);
  clearGridScene();
  ROWS.forEach((c, r) => DISTS.forEach((d, j) => { const set = variantCache[keyOf(mapKey0, c, d)]; if (set) makeCell(set, colorA, (j - 1) * DX, -(r - 1) * DZ, false, ((j - 1) * 0.9 + (r - 1) * 0.5 + Math.PI * 4) % (Math.PI * 2)); }));
  DISTS.forEach((d, j) => addGridLabel(d + " mm", (j - 1) * DX, center.y, DZ + 150));
  ROWS.forEach((c, r) => addGridLabel(c + " points", -DX - 190, center.y, -(r - 1) * DZ + 20));
  hideMain(true); gridGroup.visible = true;
  caption("One head — support points down, spacing across");
  gridCamera(0.5 * DX, -0.5 * DZ, 1950, 1800); await sleep(1800 + 4500);
  // 网格 B：列 = 五个人头，行 = 支撑点数，间距 70 mm；female 列在原点
  const needB = []; for (const h of HEADS) for (const c of ROWS) needB.push(keyOf(h, c, 70));
  await Promise.all(needB.map((k) => ensureVariantCached(k).catch(() => null)));
  const colors = {}; for (const h of HEADS) colors[h] = await headColorsFor(h);
  clearGridScene();
  HEADS.forEach((h, j) => ROWS.forEach((c, r) => { const set = variantCache[keyOf(h, c, 70)]; if (set) makeCell(set, colors[h], j * DX, -(r - 1) * DZ, false, (j * 0.9 + (r - 1) * 0.5 + Math.PI * 4) % (Math.PI * 2)); }));
  HEADS.forEach((h, j) => addGridLabel(HEAD_LABELS[h], j * DX, center.y, DZ + 150));
  ROWS.forEach((c, r) => addGridLabel(c + " points", -190, center.y, -(r - 1) * DZ + 20));
  gridGroup.visible = true;
  caption("Five heads — the same settings in every row, spacing 70 mm");
  gridCamera(2 * DX, -0.5 * DZ, 2050, 1400); await sleep(1400 + 4500);
  // 结尾：不推近，整排头集体自转再多停一会儿，淡出
  await sleep(3000);
  caption(""); await sleep(600);
  window.__demoDone = true;
  await sleep(2500);                               // 录屏在 done 后还收 1 s，淡出期间网格还在转
  clearGridScene(); hideMain(false);
  suppressRegen = false;
  document.body.classList.remove("demo", "nocursor");
}
window.__demo = runDemo;
if (urlState.get("demo") === "1") {
  // 录屏用：标题改成纯 ASCII 便于按窗口标题抓取；页面 load 后固定延时再开跑，录屏可按静止段对齐起点
  document.title = "PDT Goggles Demo";
  document.body.classList.add("predemo");         // 白幕盖住载入态，演示第一帧才揭开
  const delay = Number(urlState.get("delay") || 800);
  const kick = () => setTimeout(runDemo, delay);
  if (document.readyState === "complete") kick(); else window.addEventListener("load", kick);
}
function exportStl(mesh, filename) {
  const exporter = new STLExporter();
  const data = exporter.parse(mesh, { binary: true });
  const blob = new Blob([data], { type: "application/octet-stream" });
  const a = document.createElement("a"); a.download = filename; a.href = URL.createObjectURL(blob); a.click();
}
document.getElementById("btn-export").addEventListener("click", () => {
  // 打印件 = 镜框 + 镜片固定圈，一起导出
  if (bead.visible && bead.geometry.attributes.position) {
    const g1 = frame.geometry.clone().toNonIndexed(), g2 = bead.geometry.clone().toNonIndexed();
    for (const g of [g1, g2]) { for (const k of Object.keys(g.attributes)) if (k !== "position") g.deleteAttribute(k); }
    const merged = BufferGeometryUtils.mergeGeometries([g1, g2], false);
    exportStl(new THREE.Mesh(merged, frame.material), "pdt_goggles_frame_" + variantKey() + ".stl");
  } else exportStl(frame, "pdt_goggles_frame_" + variantKey() + ".stl");
});
document.getElementById("btn-export-lens").addEventListener("click", () => exportStl(lens, "pdt_goggles_lens_" + variantKey() + ".stl"));

// ---------- 尺寸与循环 ----------
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, true);   // 同时写 CSS 尺寸，高 DPR 屏幕上画布才不会溢出
  camera.aspect = w / h; camera.updateProjectionMatrix();
  branchMat.resolution.set(renderer.domElement.width, renderer.domElement.height);   // 粗线按像素算宽，要跟画布尺寸
  profileMarker.material.resolution.set(renderer.domElement.width, renderer.domElement.height);
  wireMat.resolution.set(renderer.domElement.width, renderer.domElement.height);
}
window.addEventListener("resize", resize);
resize();
if (THUMB) { controls.autoRotate = true; controls.autoRotateSpeed = 0.8; controls.enabled = false; }
renderer.setAnimationLoop(() => { const now = performance.now(); stepTween(now); spinGrid(now); controls.update(); renderer.render(scene, camera); placeTags(); });
window.__viewer = { setView, parts, camera, controls, renderer, scene };
</script>
