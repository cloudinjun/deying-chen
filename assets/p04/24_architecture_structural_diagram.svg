        <text x="70" y="36" font-size="14" fill="#555" text-anchor="middle">Run path</text>
    </g>

    <g transform="translate(220, 320)">
        <path d="M 0 10 L 0 70 A 70 10 0 0 0 140 70 L 140 10" fill="#f5f4ef" stroke="#d1cdc2" stroke-width="1.5"/>
        <ellipse cx="70" cy="10" rx="70" ry="10" fill="#ebeae4" stroke="#d1cdc2" stroke-width="1.5"/>
        <text x="70" y="48" font-size="15" fill="#555" text-anchor="middle">Memory</text>
    </g>

    <g transform="translate(220, 500)">
        <rect width="140" height="60" rx="6" fill="#f0f4ff" stroke="#a5b4f0" stroke-width="1.5" />
        <text x="10" y="18" font-size="10" fill="#6677aa">agent</text>
        <text x="70" y="40" font-size="15" fill="#334488" text-anchor="middle">Memory</text>
    </g>

    <g transform="translate(80, 500)">
        <rect width="100" height="60" rx="6" fill="#f0f4ff" stroke="#a5b4f0" stroke-width="1.5" />
        <text x="10" y="18" font-size="10" fill="#6677aa">agent</text>
        <text x="50" y="40" font-size="15" fill="#334488" text-anchor="middle">Perception</text>
    </g>

    <g transform="translate(480, 100)">
        <rect width="140" height="60" rx="6" fill="#eefcf5" stroke="#a1d9c1" stroke-width="1.5" />
        <text x="10" y="18" font-size="10" fill="#448866">hardware</text>
        <text x="70" y="40" font-size="15" fill="#225533" text-anchor="middle">Robot arm</text>
    </g>

    <g transform="translate(480, 280)">
        <rect width="140" height="80" rx="6" fill="#fdf6eb" stroke="#e8cda1" stroke-width="2" />
        <text x="10" y="20" font-size="10" fill="#996633">material</text>
        <text x="70" y="50" font-size="18" font-weight="bold" fill="#663311" text-anchor="middle">Clay</text>
    </g>

    <g transform="translate(480, 500)">
        <rect width="140" height="60" rx="6" fill="#eefcf5" stroke="#a1d9c1" stroke-width="1.5" />
        <text x="10" y="18" font-size="10" fill="#448866">hardware</text>
        <text x="70" y="40" font-size="15" fill="#225533" text-anchor="middle">Camera</text>
    </g>

    <g transform="translate(480, 620)">
        <rect width="140" height="60" rx="6" fill="#f5f4ef" stroke="#d1cdc2" stroke-width="1.5" />
        <text x="10" y="18" font-size="10" fill="#777">system</text>
        <text x="70" y="40" font-size="14" fill="#555" text-anchor="middle">Text / mic</text>
    </g>

    <g transform="translate(760, 100)">
        <rect width="160" height="580" rx="6" fill="#fef2ed" stroke="#e8bba8" stroke-width="1.5" />
        <text x="15" y="25" font-size="11" fill="#995544">human</text>
        <text x="80" y="300" font-size="20" font-weight="bold" fill="#662211" text-anchor="middle">Human</text>
