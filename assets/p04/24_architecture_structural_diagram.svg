    <rect x="420" y="60" width="260" height="660" rx="15" fill="none" stroke="#dddddd" stroke-dasharray="6,4" stroke-width="2" />
    <text x="435" y="85" font-size="14" font-weight="bold" fill="#aaaaaa">physical</text>

    <rect x="710" y="60" width="260" height="660" rx="15" fill="none" stroke="#dddddd" stroke-dasharray="6,4" stroke-width="2" />
    <text x="725" y="85" font-size="14" font-weight="bold" fill="#aaaaaa">human</text>

    <g fill="none" stroke="#888888" stroke-width="1.5">
        
        <path d="M 180 130 L 220 130" stroke-dasharray="5,5" marker-end="url(#arrow-dashed)" />
        <text x="200" y="122" font-size="11" fill="#777" text-anchor="middle" stroke="none">path proposal</text>

        <path d="M 290 160 L 290 200" marker-end="url(#arrow-solid)" />

        <path d="M 360 230 L 400 230 L 400 130 L 480 130" marker-end="url(#arrow-solid)" />
        <text x="405" y="180" font-size="11" fill="#777" stroke="none">control</text>

        <path d="M 550 160 L 550 280" marker-end="url(#arrow-solid)" />

        <path d="M 760 310 L 620 310" marker-end="url(#arrow-solid)" />
        <text x="690" y="302" font-size="11" fill="#777" text-anchor="middle" stroke="none">interaction</text>

        <path d="M 550 500 L 550 360" stroke-dasharray="5,5" marker-end="url(#arrow-dashed)" />

        <path d="M 480 520 L 180 520" stroke-dasharray="5,5" marker-end="url(#arrow-dashed)" />
        <path d="M 480 540 L 360 540" stroke-dasharray="5,5" marker-end="url(#arrow-dashed)" />
        <text x="430" y="512" font-size="11" fill="#777" text-anchor="middle" stroke="none">image</text>

        <path d="M 290 500 L 290 400" marker-end="url(#arrow-solid)" />
        <text x="296" y="450" font-size="11" fill="#777" stroke="none">package</text>

        <path d="M 220 530 L 180 530" stroke-dasharray="5,5" marker-end="url(#arrow-dashed)" />
        <text x="200" y="550" font-size="11" fill="#777" text-anchor="middle" stroke="none">update</text>

        <path d="M 110 500 L 110 160" stroke-dasharray="5,5" marker-end="url(#arrow-dashed)" />
        <text x="105" y="330" font-size="11" fill="#777" text-anchor="middle" transform="rotate(-90, 105, 330)" stroke="none">world state</text>

        <path d="M 220 350 L 150 350 L 150 160" marker-end="url(#arrow-solid)" />
        <text x="156" y="260" font-size="11" fill="#777" stroke="none">retrieval</text>

        <path d="M 760 650 L 620 650" marker-end="url(#arrow-solid)" />

        <path d="M 480 650 L 60 650 L 60 530 L 80 530" stroke-dasharray="5,5" marker-end="url(#arrow-dashed)" />
