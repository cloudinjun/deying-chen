        <rect x="360" width="14" height="14" fill="#f5f4ef" stroke="#d1cdc2" rx="2" />
        <text x="380" y="12" font-size="12" fill="#555">system</text>
    </g>

    <rect x="30" y="60" width="360" height="660" rx="15" fill="none" stroke="#dddddd" stroke-dasharray="6,4" stroke-width="2" />
