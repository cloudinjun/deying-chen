<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="sans-serif">
    <defs>
        <marker id="arrow-solid" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#888888" />
        </marker>
        <marker id="arrow-dashed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#888888" />
        </marker>
    </defs>

    <rect width="1000" height="750" fill="#ffffff" />

    <g transform="translate(40, 20)">
        <rect width="14" height="14" fill="#f0f4ff" stroke="#a5b4f0" rx="2" />
        <text x="20" y="12" font-size="12" fill="#555">agent</text>
        <rect x="80" width="14" height="14" fill="#eefcf5" stroke="#a1d9c1" rx="2" />
        <text x="100" y="12" font-size="12" fill="#555">hardware</text>
        <rect x="180" width="14" height="14" fill="#fdf6eb" stroke="#e8cda1" rx="2" />
        <text x="200" y="12" font-size="12" fill="#555">material</text>
        <rect x="280" width="14" height="14" fill="#fef2ed" stroke="#e8bba8" rx="2" />
