      cancelDist();
      if (moveState) {
        moveState.list.forEach(function (s) { s.g.removeAttribute('transform'); });
        moveState = null;
      }
      setShapeSelection([]);
    };

    // ---------- 变换一：门/洞口原语 ----------
    // withLeaf=false 是美式无门洞口（只留门垛短线），否则门扇转进 room 一侧
    function drawDoor(out, p1, p2, center, doorW, room, wallWidth, withLeaf) {
      var len = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      if (len < doorW + 10) return;
      var ux = (p2.x - p1.x) / len, uy = (p2.y - p1.y) / len;
      var t = (center.x - p1.x) * ux + (center.y - p1.y) * uy;
      t = Math.max(doorW / 2 + 5, Math.min(len - doorW / 2 - 5, t));
      var hinge = { x: p1.x + ux * (t - doorW / 2), y: p1.y + uy * (t - doorW / 2) };
      var jamb = { x: p1.x + ux * (t + doorW / 2), y: p1.y + uy * (t + doorW / 2) };
      out.appendChild(svgNode('path', {
        d: sketchPathData([hinge, jamb], false), fill: 'none',
        stroke: 'var(--archive-bg)', 'stroke-width': wallWidth + 2.75
      }));
      if (!withLeaf) {
        [hinge, jamb].forEach(function (p) {
          out.appendChild(svgNode('path', {
            d: sketchPathData([{ x: p.x - uy * 3, y: p.y + ux * 3 },
                               { x: p.x + uy * 3, y: p.y - ux * 3 }], false),
            fill: 'none', stroke: 'var(--archive-ink)', 'stroke-width': 1
          }));
        });
        return;
      }
      var px = -uy, py = ux;
      var probe = { x: (hinge.x + jamb.x) / 2 + px * doorW * 0.5,
                    y: (hinge.y + jamb.y) / 2 + py * doorW * 0.5 };
      if (room && !pointInPoly(probe, room)) { px = -px; py = -py; }
      var leaf = { x: hinge.x + px * doorW, y: hinge.y + py * doorW };
      out.appendChild(svgNode('path', {
        d: sketchPathData([hinge, leaf], false), fill: 'none',
        stroke: 'var(--archive-ink)', 'stroke-width': 1
      }));
      var arcPts = [];
      var a0 = Math.atan2(leaf.y - hinge.y, leaf.x - hinge.x);
      var a1 = Math.atan2(jamb.y - hinge.y, jamb.x - hinge.x);
      var dAng = a1 - a0;
      while (dAng > Math.PI) dAng -= 2 * Math.PI;
      while (dAng < -Math.PI) dAng += 2 * Math.PI;
      for (var s = 0; s <= 8; s++) {
        var ang = a0 + dAng * s / 8;
        arcPts.push({ x: hinge.x + Math.cos(ang) * doorW, y: hinge.y + Math.sin(ang) * doorW });
      }
      out.appendChild(svgNode('path', {
        d: sketchPathData(arcPts, false), fill: 'none',
        stroke: 'var(--archive-ink)', 'stroke-width': 1, opacity: .45
      }));
    }

    // 面积从大到小命名；前两名是美式开敞空间（对走廊无门），HALL 留给走廊本体
    var ROOM_NAMES = ['LIVING', 'KITCHEN', 'BEDROOM', 'BATH', 'STUDY', 'STORE'];

    // 图纸比例：自动从常用比例尺里选一个让总面积落到可信区间（≥30 M²）
    function pickPlanScale(totalPx) {
      var mmScale = 100 / rulerStep;
      var totalM2 = totalPx * mmScale * mmScale / 1e6;
      var scales = [10, 20, 50, 100, 200];
      for (var si = 0; si < scales.length; si++) {
        if (totalM2 * scales[si] * scales[si] >= 30) return scales[si];
      }
      return scales[scales.length - 1];
    }

    // 平面核心：走廊模式（中轴 HALL + 底边 ENTRY + 房间沿走廊排列），小形/带内院退化为递归切分
    function planCore(out, pts, courts, drawScale) {
      var total = Math.abs(polyArea(pts));
      courts.forEach(function (court) { total -= Math.abs(polyArea(court)); });
      total = Math.max(total, 1);
      // 外墙（含内院墙）用粗笔重描——输入形本体此刻已退位成灰虚线
      out.appendChild(svgNode('path', {
        d: sketchPathData(pts, true), fill: 'none', stroke: 'var(--archive-ink)', 'stroke-width': 1.75
      }));
      courts.forEach(function (court) {
        out.appendChild(svgNode('path', {
          d: sketchPathData(court, true), fill: 'none', stroke: 'var(--archive-ink)', 'stroke-width': 1.75
        }));
      });

      var b = polyBounds(pts);
      var mmScale = 100 / rulerStep;
      var pxPerMm = 1 / (mmScale * drawScale);
      var corridorW = 1200 * pxPerMm;
      var doorW = Math.max(9, 900 * pxPerMm);
      var entryW = Math.max(11, 1000 * pxPerMm);
      var openW = Math.max(14, 1600 * pxPerMm);

      var walls = [];
      var rooms = [];
      var corridor = null;
      var corB = null;

      if (b.maxX - b.minX > corridorW * 2.6 && b.maxY - b.minY > corridorW * 2 && !courts.length) {
        var ccx = (b.minX + b.maxX) / 2;
        if (snapEnabled) ccx = Math.round(ccx / snapUnit) * snapUnit;
        var xL = ccx - corridorW / 2;
        var xR = ccx + corridorW / 2;
        var left = clipHalf(pts, 'x', xL, true);
        var midRight = clipHalf(pts, 'x', xL, false);
        var slab = clipHalf(midRight, 'x', xR, true);
        var right = clipHalf(midRight, 'x', xR, false);
        var sb = polyBounds(slab);
        var yTop = sb.minY + (sb.maxY - sb.minY) * 0.42;
        if (snapEnabled) yTop = Math.round(yTop / snapUnit) * snapUnit;
        var topRoom = clipHalf(slab, 'y', yTop, true);
        corridor = clipHalf(slab, 'y', yTop, false);
        if (corridor.length >= 3 && topRoom.length >= 3 && left.length >= 3 && right.length >= 3) {
          corB = polyBounds(corridor);
          [xL, xR].forEach(function (wx) {
            var hits = lineHits(pts, 'x', wx);
            var spans = [];
            for (var k = 0; k + 1 < hits.length; k += 2) spans.push([hits[k], hits[k + 1]]);
            walls.push({ axis: 'x', v: wx, spans: spans });
          });
          var topHits = lineHits(pts, 'y', yTop);
          var topSpans = [];
          for (var k2 = 0; k2 + 1 < topHits.length; k2 += 2) {
            var s0 = Math.max(topHits[k2], xL), s1 = Math.min(topHits[k2 + 1], xR);
            if (s1 - s0 > 4) topSpans.push([s0, s1]);
          }
          walls.push({ axis: 'y', v: yTop, spans: topSpans });
          rooms.push(topRoom);
          [left, right].forEach(function (wing) {
            var pieces = [wing];
            var wingTarget = Math.max(1, Math.min(3, Math.round(Math.abs(polyArea(wing)) / total * 5)));
            var wingGuard = 0;
            while (pieces.length < wingTarget && wingGuard++ < 12) {
              var bi = 0;
              pieces.forEach(function (p, i) {
                if (Math.abs(polyArea(p)) > Math.abs(polyArea(pieces[bi]))) bi = i;
              });
              var piece = pieces[bi];
              var pb2 = polyBounds(piece);
              var v = pb2.minY + (pb2.maxY - pb2.minY) * (0.4 + Math.random() * 0.2);
              if (snapEnabled) v = Math.round(v / snapUnit) * snapUnit;
              if (v <= pb2.minY + 10 || v >= pb2.maxY - 10) continue;
              var pa = clipHalf(piece, 'y', v, true);
              var pz = clipHalf(piece, 'y', v, false);
              if (pa.length < 3 || pz.length < 3) continue;
              var hh = lineHits(piece, 'y', v);
              var ss = [];
              for (var m = 0; m + 1 < hh.length; m += 2) ss.push([hh[m], hh[m + 1]]);
              walls.push({ axis: 'y', v: v, spans: ss, wing: true });
              pieces.splice(bi, 1, pa, pz);
            }
            pieces.forEach(function (p) { rooms.push(p); });
          });
        } else {
          corridor = null;
        }
      }

      if (!corridor) {
        rooms = [pts.slice()];
        var target = Math.max(3, Math.min(6, Math.round(Math.sqrt(total) / 90) + 2));
        var guard = 0;
        while (rooms.length < target && guard++ < 24) {
          var bigIndex = 0;
          rooms.forEach(function (room, ri) {
            if (Math.abs(polyArea(room)) > Math.abs(polyArea(rooms[bigIndex]))) bigIndex = ri;
          });
          var room = rooms[bigIndex];
          var rb = polyBounds(room);
          var axis = (rb.maxX - rb.minX) >= (rb.maxY - rb.minY) ? 'x' : 'y';
          var lo = axis === 'x' ? rb.minX : rb.minY;
          var hi = axis === 'x' ? rb.maxX : rb.maxY;
          var v2 = lo + (hi - lo) * (0.38 + Math.random() * 0.24);
          if (snapEnabled) v2 = Math.round(v2 / snapUnit) * snapUnit;
          if (v2 <= lo + 12 || v2 >= hi - 12) continue;
          var partA = clipHalf(room, axis, v2, true);
          var partB = clipHalf(room, axis, v2, false);
          if (partA.length < 3 || partB.length < 3) continue;
          if (Math.abs(polyArea(partA)) < total * 0.06 || Math.abs(polyArea(partB)) < total * 0.06) continue;
          rooms.splice(bigIndex, 1, partA, partB);
          var hits2 = lineHits(room, axis, v2);
          var spans2 = [];
          for (var k3 = 0; k3 + 1 < hits2.length; k3 += 2) spans2.push([hits2[k3], hits2[k3 + 1]]);
          walls.push({ axis: axis, v: v2, spans: spans2 });
        }
      }

      // 房间与走廊的接触段
      function corridorContact(room) {
        if (!corridor) return null;
        var rb = polyBounds(room);
        var y0 = Math.max(rb.minY, corB.minY), y1 = Math.min(rb.maxY, corB.maxY);
        if (rb.maxX <= corB.minX + 2 && y1 - y0 > doorW * 0.8) return { side: 'L', a: y0, b: y1 };
        if (rb.minX >= corB.maxX - 2 && y1 - y0 > doorW * 0.8) return { side: 'R', a: y0, b: y1 };
        var x0 = Math.max(rb.minX, corB.minX), x1 = Math.min(rb.maxX, corB.maxX);
        if (Math.abs(rb.maxY - corB.minY) < 2 && x1 - x0 > doorW * 0.8) return { side: 'T', a: x0, b: x1 };
        return null;
      }

      // 命名先于开门：贴走廊的房间优先拿 LIVING/KITCHEN 的开敞名分
      var named = rooms.map(function (room) {
        return { room: room, c: polyCentroid(room), contact: corridorContact(room) };
      }).filter(function (item) {
        return !courts.some(function (court) { return pointInPoly(item.c, court); });
      }).sort(function (A, B) {
        var touch = (B.contact ? 1 : 0) - (A.contact ? 1 : 0);
        if (touch) return touch;
        return Math.abs(polyArea(B.room)) - Math.abs(polyArea(A.room));
      });
      named.forEach(function (item, i) {
        item.name = ROOM_NAMES[Math.min(i, ROOM_NAMES.length - 1)];
      });

      // 内墙（被内院打断）
      walls.forEach(function (wall) {
        var courtIvs = [];
        courts.forEach(function (court) {
          var ch = lineHits(court, wall.axis, wall.v);
          for (var m = 0; m + 1 < ch.length; m += 2) courtIvs.push([ch[m], ch[m + 1]]);
        });
        var spansCut = [];
        wall.spans.forEach(function (span) {
          subtractSpan(span, courtIvs).forEach(function (piece) { spansCut.push(piece); });
        });
        wall.cut = spansCut;
        spansCut.forEach(function (span) {
          var p1 = wall.axis === 'x' ? { x: wall.v, y: span[0] } : { x: span[0], y: wall.v };
          var p2 = wall.axis === 'x' ? { x: wall.v, y: span[1] } : { x: span[1], y: wall.v };
          out.appendChild(svgNode('path', {
            d: sketchPathData([p1, p2], false), fill: 'none',
            stroke: 'var(--archive-ink)', 'stroke-width': 1.25
          }));
        });
      });

      // 开门
      if (corridor) {
        named.forEach(function (item) {
          if (!item.contact) return;
          var open = item.name === 'LIVING' || item.name === 'KITCHEN';
          var w = Math.min(open ? openW : doorW, (item.contact.b - item.contact.a) * 0.8);
          var ct = item.contact;
          if (ct.side === 'L') {
            drawDoor(out, { x: corB.minX, y: ct.a }, { x: corB.minX, y: ct.b },
              { x: corB.minX, y: (ct.a + ct.b) / 2 }, w, item.room, 1.25, !open);
          } else if (ct.side === 'R') {
            drawDoor(out, { x: corB.maxX, y: ct.a }, { x: corB.maxX, y: ct.b },
              { x: corB.maxX, y: (ct.a + ct.b) / 2 }, w, item.room, 1.25, !open);
          } else {
            drawDoor(out, { x: ct.a, y: corB.minY }, { x: ct.b, y: corB.minY },
              { x: (ct.a + ct.b) / 2, y: corB.minY }, w, item.room, 1.25, !open);
          }
        });
        // 翼内的房间彼此串门，走廊够不到的远端房间也有路可走
        walls.forEach(function (wall) {
          if (!wall.wing) return;
          (wall.cut || wall.spans).forEach(function (span) {
            if (span[1] - span[0] < doorW + 12) return;
            drawDoor(out, { x: span[0], y: wall.v }, { x: span[1], y: wall.v },
              { x: (span[0] + span[1]) / 2, y: wall.v },
              Math.min(doorW, (span[1] - span[0]) * 0.4), pts, 1.25, true);
          });
        });
        // 入户门：走廊底端的外墙边
        var ecx = (corB.minX + corB.maxX) / 2;
        var vHits = lineHits(pts, 'x', ecx);
        if (vHits.length) {
          var bottomY = vHits[vHits.length - 1];
          var eP = { x: ecx, y: bottomY };
          for (var ei = 0; ei < pts.length; ei++) {
            var ea = pts[ei], eb = pts[(ei + 1) % pts.length];
            if (distToSegment(eP, ea, eb) < 2) {
              drawDoor(out, ea, eb, eP, entryW, pts, 1.75, true);
              out.appendChild(sketchLabel(ecx + 8, bottomY - 6, 'ENTRY', 'var(--archive-accent)'));
              break;
            }
          }
        }
      } else {
        walls.forEach(function (wall) {
          (wall.cut || wall.spans).forEach(function (span) {
            if (span[1] - span[0] < doorW + 12) return;
            var p1 = wall.axis === 'x' ? { x: wall.v, y: span[0] } : { x: span[0], y: wall.v };
            var p2 = wall.axis === 'x' ? { x: wall.v, y: span[1] } : { x: span[1], y: wall.v };
            drawDoor(out, p1, p2, { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 },
              Math.min(doorW, (span[1] - span[0]) * 0.4), pts, 1.25, true);
          });
        });
        var longest = 0, li = 0;
        for (var e2 = 0; e2 < pts.length; e2++) {
          var l2 = Math.hypot(pts[(e2 + 1) % pts.length].x - pts[e2].x,
                              pts[(e2 + 1) % pts.length].y - pts[e2].y);
          if (l2 > longest) { longest = l2; li = e2; }
        }
        var la = pts[li], lb = pts[(li + 1) % pts.length];
        drawDoor(out, la, lb, { x: (la.x + lb.x) / 2, y: (la.y + lb.y) / 2 }, entryW, pts, 1.75, true);
        out.appendChild(sketchLabel((la.x + lb.x) / 2 + 8, (la.y + lb.y) / 2 - 6, 'ENTRY', 'var(--archive-accent)'));
      }

      // 标注：房间名 + 按比例面积；走廊本体标 HALL
      named.forEach(function (item) {
        var m2 = Math.abs(polyArea(item.room)) * mmScale * mmScale / 1e6 * drawScale * drawScale;
        out.appendChild(sketchLabel(item.c.x - 20, item.c.y - 2, item.name, 'var(--archive-ink)', '700'));
        out.appendChild(sketchLabel(item.c.x - 20, item.c.y + 10, m2.toFixed(1) + ' M²', 'var(--archive-muted)', '500'));
      });
      if (corridor) {
        var hcc = polyCentroid(corridor);
        var hm2 = Math.abs(polyArea(corridor)) * mmScale * mmScale / 1e6 * drawScale * drawScale;
        out.appendChild(sketchLabel(hcc.x - 14, hcc.y - 2, 'HALL', 'var(--archive-ink)', '700'));
        out.appendChild(sketchLabel(hcc.x - 14, hcc.y + 10, hm2.toFixed(1) + ' M²', 'var(--archive-muted)', '500'));
      }
      // 内院：细密填充 + COURT 标注
      courts.forEach(function (court) {
        var cb = polyBounds(court);
        for (var hy = cb.minY + 5; hy < cb.maxY; hy += 5) {
          var ch2 = lineHits(court, 'y', hy);
          for (var m2i = 0; m2i + 1 < ch2.length; m2i += 2) {
            out.appendChild(svgNode('path', {
              d: 'M' + ch2[m2i].toFixed(1) + ' ' + hy.toFixed(1)
                + 'L' + ch2[m2i + 1].toFixed(1) + ' ' + hy.toFixed(1),
              fill: 'none', stroke: 'var(--info)', 'stroke-width': 1, opacity: .28
            }));
          }
        }
        var courtC = polyCentroid(court);
        out.appendChild(sketchLabel(courtC.x - 16, courtC.y + 3, 'COURT', 'var(--info)', '700'));
      });
    }

    // PLAN（单形）：自选比例尺 + 平面核心 + 比例标注
    function drawPlan(shape) {
      var courts = shape.holes || [];
      var totalPx = Math.abs(polyArea(shape.points));
      courts.forEach(function (court) { totalPx -= Math.abs(polyArea(court)); });
      var drawScale = pickPlanScale(Math.max(totalPx, 1));
      planCore(shape.output, shape.points, courts, drawScale);
      var pb = polyBounds(shape.points);
      shape.output.appendChild(sketchLabel(pb.minX, pb.maxY + 16, 'SCALE 1:' + drawScale, 'var(--archive-muted)', '500'));
    }

    // AXON：拔起为轴测体（顶面粗笔、竖棱轻笔、洞口翻上顶面）
    function drawAxon(shape) {
      var pts = shape.points;
      var b = polyBounds(pts);
      var h = Math.max(40, Math.min(120, (b.maxY - b.minY) * 0.6));
      var adx = h * 0.5, ady = -h * 0.87;
      var top = pts.map(function (p) { return { x: p.x + adx, y: p.y + ady }; });
      var out = shape.output;
      pts.forEach(function (p, i) {
        out.appendChild(svgNode('path', {
          d: sketchPathData([p, top[i]], false), fill: 'none',
          stroke: 'var(--archive-ink)', 'stroke-width': 1, opacity: .45
        }));
      });
      out.appendChild(svgNode('path', {
        d: sketchPathData(top, true), fill: 'none', stroke: 'var(--archive-ink)', 'stroke-width': 1.75
      }));
      (shape.holes || []).forEach(function (hole) {
        out.appendChild(svgNode('path', {
          d: sketchPathData(hole.map(function (p) { return { x: p.x + adx, y: p.y + ady }; }), true),
          fill: 'none', stroke: 'var(--archive-ink)', 'stroke-width': 1.25
        }));
      });
      var hiIndex = 0;
      pts.forEach(function (p, i) { if (p.x > pts[hiIndex].x) hiIndex = i; });
      out.appendChild(sketchLabel(pts[hiIndex].x + 10, (pts[hiIndex].y + top[hiIndex].y) / 2,
        'H ' + formatMm(h / rulerStep * 100) + ' MM', 'var(--archive-accent)'));
    }

    // 刀路核心：粗笔切割轮廓 + 之字填充（绕洞）+ 行进箭头 + 进刀标记，返回行数
    function renderCutting(out, pts, holes, entryText) {
      var b = polyBounds(pts);
      out.appendChild(svgNode('path', {
        d: sketchPathData(pts, true), fill: 'none', stroke: 'var(--archive-ink)', 'stroke-width': 1.75
      }));
      holes.forEach(function (hole) {
        out.appendChild(svgNode('path', {
          d: sketchPathData(hole, true), fill: 'none', stroke: 'var(--archive-ink)', 'stroke-width': 1.75
        }));
      });
      var spacing = Math.max(8, snapUnit * 0.5);
      var passes = 0;
      for (var y = b.minY + spacing; y < b.maxY; y += spacing) {
        var hits = lineHits(pts, 'y', y);
        var holeIvs = [];
        holes.forEach(function (hole) {
          var hh = lineHits(hole, 'y', y);
          for (var m = 0; m + 1 < hh.length; m += 2) holeIvs.push([hh[m], hh[m + 1]]);
        });
        for (var k = 0; k + 1 < hits.length; k += 2) {
          subtractSpan([hits[k], hits[k + 1]], holeIvs).forEach(function (piece) {
            out.appendChild(svgNode('path', {
              d: 'M' + piece[0].toFixed(1) + ' ' + y.toFixed(1)
                + 'L' + piece[1].toFixed(1) + ' ' + y.toFixed(1),
              fill: 'none', stroke: 'var(--info)', 'stroke-width': 1, opacity: .75
            }));
            passes++;
          });
        }
      }
      for (var i = 0; i < pts.length; i++) {
        var a = pts[i], c = pts[(i + 1) % pts.length];
        var mx = (a.x + c.x) / 2, my = (a.y + c.y) / 2;
        var ang = Math.atan2(c.y - a.y, c.x - a.x);
        var s = 5;
        out.appendChild(svgNode('path', {
          d: 'M' + (mx + Math.cos(ang) * s).toFixed(1) + ' ' + (my + Math.sin(ang) * s).toFixed(1)
            + 'L' + (mx + Math.cos(ang + 2.6) * s).toFixed(1) + ' ' + (my + Math.sin(ang + 2.6) * s).toFixed(1)
            + 'L' + (mx + Math.cos(ang - 2.6) * s).toFixed(1) + ' ' + (my + Math.sin(ang - 2.6) * s).toFixed(1) + 'Z',
          fill: 'var(--archive-ink)'
        }));
      }
      out.appendChild(svgNode('circle', {
        cx: pts[0].x, cy: pts[0].y, r: 4,
        fill: 'none', stroke: 'var(--archive-accent)', 'stroke-width': 1
      }));
      out.appendChild(sketchLabel(pts[0].x + 8, pts[0].y - 8, entryText, 'var(--archive-accent)'));
      return passes;
    }

    // PATH（单形）：刀路核心 + 本件 G-code 摘要
    function drawPath(shape) {
      var passes = renderCutting(shape.output, shape.points, shape.holes || [], 'IN');
      var b = polyBounds(shape.points);
      ['G21 G90',
       'G0 X' + mmOf(shape.points[0].x) + ' Y' + mmOf(shape.points[0].y),
       'G1 F1200 · ' + passes + ' PASSES'].forEach(function (line, li) {
        shape.output.appendChild(sketchLabel(b.minX, b.maxY + 16 + li * 12, line, 'var(--archive-muted)', '500'));
      });
    }

    // ---------- 单形变换入口 ----------
    function applyOp(shape, op) {
      clearSetOutput();
      if (shape.output && shape.output.parentNode) shape.output.parentNode.removeChild(shape.output);
      shape.output = svgNode('g', {});
      shape.g.appendChild(shape.output);
      shape.activeOp = op;
      if (op === 'axon') drawAxon(shape);
      else if (op === 'plan') drawPlan(shape);
      else if (op === 'path') drawPath(shape);
      // 输入形退位成灰虚线构造线，主角让给输出
      repaintShape(shape);
    }

    function clearSetOutput() {
      if (setOutput && setOutput.parentNode) setOutput.parentNode.removeChild(setOutput);
      setOutput = null;
      shapes.forEach(function (s) {
        if (s.inSet) { s.inSet = false; repaintShape(s); }
      });
    }

    // ---------- 组处理：作用于当前形状选择集（2+）----------
    function applySetOp(op) {
      var group = shapeSelection.slice();
      if (group.length < 2) return;
      group.forEach(function (s) {
        if (s.output && s.output.parentNode) s.output.parentNode.removeChild(s.output);
        s.output = null;
        s.activeOp = null;
      });
      clearSetOutput();
      setOutput = svgNode('g', {});
      sketchPaper.appendChild(setOutput);
      if (op === 'massing') drawMassing(group);
      else if (op === 'site') drawSite(group);
      else drawNest(group);
      group.forEach(function (s) { s.inSet = true; repaintShape(s); });
      syncCtx();
    }

    // MASSING：多个形一起拔起，面积大的矮、小的高，后排先画顶面遮挡
    function drawMassing(group) {
      var byArea = group.slice().sort(function (a, b) {
        return Math.abs(polyArea(b.points)) - Math.abs(polyArea(a.points));
      });
      var heights = [52, 92, 132];
      group.slice().sort(function (a, b) {
        return polyBounds(a.points).maxY - polyBounds(b.points).maxY;
      }).forEach(function (s) {
        var h = heights[Math.min(byArea.indexOf(s), heights.length - 1)];
        var adx = h * 0.5, ady = -h * 0.87;
        var top = s.points.map(function (p) { return { x: p.x + adx, y: p.y + ady }; });
        s.points.forEach(function (p, i) {
          setOutput.appendChild(svgNode('path', {
            d: sketchPathData([p, top[i]], false), fill: 'none',
            stroke: 'var(--archive-ink)', 'stroke-width': 1, opacity: .45
          }));
        });
        setOutput.appendChild(svgNode('path', {
          d: sketchPathData(top, true), fill: 'var(--archive-bg)', 'fill-opacity': .92,
          stroke: 'var(--archive-ink)', 'stroke-width': 1.75
        }));
        var hi = 0;
        s.points.forEach(function (p, i) { if (p.x > s.points[hi].x) hi = i; });
        setOutput.appendChild(sketchLabel(s.points[hi].x + 10, (s.points[hi].y + top[hi].y) / 2,
          'H ' + formatMm(h / rulerStep * 100) + ' MM', 'var(--archive-accent)'));
      });
    }

    // NEST：一份程序切完所有件，IN 点标顺序，虚线空程衔接，报利用率
    function drawNest(group) {
      var totalPasses = 0;
      var prevEntry = null;
      var nMinX = 1e9, nMinY = 1e9, nMaxX = -1e9, nMaxY = -1e9, used = 0;
      group.forEach(function (s, i) {
        totalPasses += renderCutting(setOutput, s.points, s.holes || [], ('0' + (i + 1)).slice(-2));
        if (prevEntry) {
          setOutput.appendChild(svgNode('path', {
            d: sketchPathData([prevEntry, s.points[0]], false), fill: 'none',
            stroke: 'var(--info)', 'stroke-width': 1, 'stroke-dasharray': '4 4', opacity: .6
          }));
        }
        prevEntry = s.points[0];
        var b = polyBounds(s.points);
        nMinX = Math.min(nMinX, b.minX); nMinY = Math.min(nMinY, b.minY);
        nMaxX = Math.max(nMaxX, b.maxX); nMaxY = Math.max(nMaxY, b.maxY);
        used += Math.abs(polyArea(s.points));
        (s.holes || []).forEach(function (hole) { used -= Math.abs(polyArea(hole)); });
      });
      var util = Math.round(used / Math.max(1, (nMaxX - nMinX) * (nMaxY - nMinY)) * 100);
      ['G21 G90',
       'G1 F1200 · ' + totalPasses + ' PASSES · ' + group.length + ' PARTS',
       'SHEET ' + util + '% USED'].forEach(function (line, li) {
        setOutput.appendChild(sketchLabel(nMinX, nMaxY + 16 + li * 12, line, 'var(--archive-muted)', '500'));
      });
    }

    // SITE：共享比例尺的总图，各形自摆平面，相邻形之间标退距
    function drawSite(group) {
      var totalPx = 0;
      group.forEach(function (s) {
        totalPx += Math.abs(polyArea(s.points));
        (s.holes || []).forEach(function (hole) { totalPx -= Math.abs(polyArea(hole)); });
      });
      var drawScale = pickPlanScale(Math.max(totalPx, 1));
      group.forEach(function (s) { planCore(setOutput, s.points, s.holes || [], drawScale); });
      var recs = group.map(function (s) { return polyBounds(s.points); })
        .sort(function (a, b) { return a.minX - b.minX; });
      var mmScale = 100 / rulerStep;
      for (var i = 0; i + 1 < recs.length; i++) {
        var A = recs[i], B = recs[i + 1];
        var gap = B.minX - A.maxX;
        if (gap < 12) continue;
        var y0 = Math.max(A.minY, B.minY), y1 = Math.min(A.maxY, B.maxY);
        var y = y0 < y1 ? (y0 + y1) / 2 : (A.minY + A.maxY) / 2;
        var p1 = { x: A.maxX, y: y }, p2 = { x: B.minX, y: y };
        setOutput.appendChild(svgNode('path', {
          d: sketchPathData([p1, p2], false), fill: 'none',
          stroke: 'var(--archive-accent)', 'stroke-width': 1
        }));
        [p1, p2].forEach(function (p) {
          setOutput.appendChild(svgNode('path', {
            d: sketchPathData([{ x: p.x, y: p.y - 4 }, { x: p.x, y: p.y + 4 }], false),
            fill: 'none', stroke: 'var(--archive-accent)', 'stroke-width': 1
          }));
        });
        var meters = gap * mmScale * drawScale / 1000;
        setOutput.appendChild(sketchLabel((p1.x + p2.x) / 2 - 8, y - 6,
          meters.toFixed(1) + ' M', 'var(--archive-accent)'));
      }
      var gMinX = 1e9, gMaxY = -1e9;
      group.forEach(function (s) {
        var b = polyBounds(s.points);
        gMinX = Math.min(gMinX, b.minX);
        gMaxY = Math.max(gMaxY, b.maxY);
      });
      setOutput.appendChild(sketchLabel(gMinX, gMaxY + 16, 'SCALE 1:' + drawScale, 'var(--archive-muted)', '500'));
    }

    // ---------- 布尔运算 ----------
    function polygonsOverlap(a, b) {
      for (var i = 0; i < a.length; i++) {
        for (var j = 0; j < b.length; j++) {
          if (segInt(a[i], a[(i + 1) % a.length], b[j], b[(j + 1) % b.length])) return true;
        }
      }
      return pointInPoly(a[0], b) || pointInPoly(b[0], a);
    }

    function findOverlapTarget(shape) {
      for (var i = shapes.length - 1; i >= 0; i--) {
        if (shapes[i] !== shape && polygonsOverlap(shapes[i].points, shape.points)) return shapes[i];
      }
      return null;
    }

    // Greiner–Hormann（简化版）：对第二个形做亚像素微扰，回避吸附带来的共点/共线退化
    function polygonBoolean(subjectPts, clipRaw, mode) {
      var clipPts = clipRaw.map(function (p, i) {
        return { x: p.x + 0.137 + (i % 3) * 0.017, y: p.y - 0.093 + (i % 2) * 0.019 };
      });
      var crossings = 0;
      for (var i0 = 0; i0 < subjectPts.length; i0++) {
        for (var j0 = 0; j0 < clipPts.length; j0++) {
          if (segInt(subjectPts[i0], subjectPts[(i0 + 1) % subjectPts.length],
                     clipPts[j0], clipPts[(j0 + 1) % clipPts.length])) crossings++;
        }
      }
      if (!crossings) {
        var bInA = pointInPoly(clipPts[0], subjectPts);
        var aInB = pointInPoly(subjectPts[0], clipPts);
        if (mode === 'union') {
          if (bInA) return [{ points: subjectPts }];
          if (aInB) return [{ points: clipRaw }];
          return [{ points: subjectPts }, { points: clipRaw }];
        }
        if (mode === 'intersect') {
          if (bInA) return [{ points: clipRaw }];
          if (aInB) return [{ points: subjectPts }];
          return [];
        }
        if (bInA) return [{ points: subjectPts, holes: [clipRaw] }];
        if (aInB) return [];
        return [{ points: subjectPts }];
      }
      function ringNodes(pts) {
        return pts.map(function (p) {
          return { x: p.x, y: p.y, intersect: false, visited: false };
        });
      }
      var S = ringNodes(subjectPts);
      var C = ringNodes(clipPts);
      var sIns = S.map(function () { return []; });
      var cIns = C.map(function () { return []; });
      for (var si = 0; si < S.length; si++) {
        for (var ci = 0; ci < C.length; ci++) {
          var hit = segInt(S[si], S[(si + 1) % S.length], C[ci], C[(ci + 1) % C.length]);
          if (!hit) continue;
          var ns = { x: hit.x, y: hit.y, intersect: true, visited: false, alpha: hit.t };
          var nc = { x: hit.x, y: hit.y, intersect: true, visited: false, alpha: hit.u };
          ns.neighbor = nc;
          nc.neighbor = ns;
          sIns[si].push(ns);
          cIns[ci].push(nc);
        }
      }
      function link(orig, inserts) {
        var chain = [];
        orig.forEach(function (origNode, oi) {
          chain.push(origNode);
          inserts[oi].sort(function (a, b) { return a.alpha - b.alpha; })
            .forEach(function (n) { chain.push(n); });
        });
        chain.forEach(function (n, ni) {
          n.next = chain[(ni + 1) % chain.length];
          n.prev = chain[(ni - 1 + chain.length) % chain.length];
        });
        return chain;
      }
      var sChain = link(S, sIns);
      var cChain = link(C, cIns);
      function markEntries(chain, otherPts, invert) {
        var status = !pointInPoly(chain[0], otherPts);
        if (invert) status = !status;
        chain.forEach(function (n) {
          if (n.intersect) { n.entry = status; status = !status; }
        });
      }
      markEntries(sChain, clipPts, mode === 'union' || mode === 'subtract');
      markEntries(cChain, subjectPts, mode === 'union');
      var results = [];
      var guard = 0;
      for (var k = 0; k < sChain.length; k++) {
        var start = sChain[k];
        if (!start.intersect || start.visited) continue;
        var poly = [{ x: start.x, y: start.y }];
        var current = start;
        do {
          current.visited = true;
          if (current.neighbor) current.neighbor.visited = true;
          if (current.entry) {
            do { current = current.next; poly.push({ x: current.x, y: current.y }); }
            while (!current.intersect && guard++ < 4000);
          } else {
            do { current = current.prev; poly.push({ x: current.x, y: current.y }); }
            while (!current.intersect && guard++ < 4000);
          }
          current = current.neighbor;
        } while (current !== start && current.neighbor !== start && guard++ < 4000);
        var clean = [];
        poly.forEach(function (p) {
          var last = clean[clean.length - 1];
          if (!last || Math.hypot(p.x - last.x, p.y - last.y) > 0.6) clean.push(p);
        });
        while (clean.length > 1
               && Math.hypot(clean[0].x - clean[clean.length - 1].x,
                             clean[0].y - clean[clean.length - 1].y) < 0.6) clean.pop();
        if (clean.length >= 3 && Math.abs(polyArea(clean)) > 60) results.push({ points: clean });
      }
      return results;
    }

    function removeShape(shape) {
      if (shape.g && shape.g.parentNode) shape.g.parentNode.removeChild(shape.g);
      var selAt = shapeSelection.indexOf(shape);
      if (selAt > -1) shapeSelection.splice(selAt, 1);
      var at = shapes.indexOf(shape);
      if (at > -1) shapes.splice(at, 1);
    }

    function doBoolean(shapeA, shapeB, mode) {
      clearSetOutput();
      var pieces = polygonBoolean(shapeA.points, shapeB.points, mode);
      var inheritedOp = shapeA.activeOp || shapeB.activeOp;
      var holesA = shapeA.holes || [];
      removeShape(shapeA);
      removeShape(shapeB);
      var mountedAll = [];
      pieces.forEach(function (piece) {
        var keepHoles = (piece.holes || []).concat(holesA.filter(function (hole) {
          return pointInPoly(polyCentroid(hole), piece.points);
        }));
        var mounted = mountShape(piece.points, keepHoles);
        // “新形状出现后自动重算”：布尔完成立刻在新几何上重跑原变换
        if (inheritedOp) applyOp(mounted, inheritedOp);
        mountedAll.push(mounted);
      });
      setShapeSelection(mountedAll);
    }

    function deleteShapeSelection() {
      clearSetOutput();
      shapeSelection.slice().forEach(removeShape);
      setShapeSelection([]);
    }

    // 旋转选中：绕选择集包围盒中心顺时针 90°；转轴吸到网格，旋转后仍对网格
    function rotateShapes90() {
      if (!shapeSelection.length) return;
      clearSetOutput();
      var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
      shapeSelection.forEach(function (s) {
        var b = polyBounds(s.points);
        minX = Math.min(minX, b.minX); minY = Math.min(minY, b.minY);
        maxX = Math.max(maxX, b.maxX); maxY = Math.max(maxY, b.maxY);
      });
      var rcx = (minX + maxX) / 2, rcy = (minY + maxY) / 2;
      if (snapEnabled) {
        rcx = Math.round(rcx / snapUnit) * snapUnit;
        rcy = Math.round(rcy / snapUnit) * snapUnit;
      }
      // 预判旋转后的包围盒，越界就整体平移回垫内
      var nMinX = rcx - (maxY - rcy), nMaxX = rcx - (minY - rcy);
      var nMinY = rcy + (minX - rcx), nMaxY = rcy + (maxX - rcx);
      var sx = 0, sy = 0;
      if (nMinX < 4) sx = 4 - nMinX;
      else if (nMaxX > hero.clientWidth - 4) sx = (hero.clientWidth - 4) - nMaxX;
      if (nMinY < 24) sy = 24 - nMinY;
      else if (nMaxY > hero.clientHeight - 6) sy = (hero.clientHeight - 6) - nMaxY;
      if (snapEnabled) {
        sx = Math.round(sx / snapUnit) * snapUnit;
        sy = Math.round(sy / snapUnit) * snapUnit;
      }
      shapeSelection.slice().forEach(function (s) {
        transformShape(s, function (p) {
          return { x: rcx - (p.y - rcy) + sx, y: rcy + (p.x - rcx) + sy };
        });
      });
      syncCtx();
    }

    // ---------- 两点测距 ----------
    var distPreview = null;
    function startDist() {
      distState = { p1: null };
      syncCtx();
    }
    function cancelDist() {
      distState = null;
      if (distPreview && distPreview.parentNode) distPreview.parentNode.removeChild(distPreview);
      distPreview = null;
      syncCtx();
    }
    function dimNode(p1, p2) {
      var g = svgNode('g', {});
      g.appendChild(svgNode('path', {
        d: sketchPathData([p1, p2], false), fill: 'none',
        stroke: 'var(--archive-accent)', 'stroke-width': 1
      }));
      var ang = Math.atan2(p2.y - p1.y, p2.x - p1.x) + Math.PI / 2;
      [p1, p2].forEach(function (p) {
        g.appendChild(svgNode('path', {
          d: sketchPathData([{ x: p.x + Math.cos(ang) * 4, y: p.y + Math.sin(ang) * 4 },
                             { x: p.x - Math.cos(ang) * 4, y: p.y - Math.sin(ang) * 4 }], false),
          fill: 'none', stroke: 'var(--archive-accent)', 'stroke-width': 1
        }));
      });
      g.appendChild(sketchLabel((p1.x + p2.x) / 2 + 5, (p1.y + p2.y) / 2 - 5,
        formatMm(Math.hypot(p2.x - p1.x, p2.y - p1.y) / rulerStep * 100) + ' MM', 'var(--archive-accent)'));
      return g;
    }
    function handleDistClick(pt) {
      if (!distState.p1) {
        distState.p1 = { x: pt.x, y: pt.y };
        syncCtx();
        return;
      }
      sketchPaper.appendChild(dimNode(distState.p1, pt));
      cancelDist();
    }

    // ---------- 光标旁上下文菜单（fixed 定位，不受 hero 裁剪）----------
    var ctxMenu = archiveNode('div', 'archive-ctx');
    ctxMenu.setAttribute('role', 'menu');
    frame.appendChild(ctxMenu);

    function placeCtx() {
      ctxMenu.style.display = 'flex';
      ctxMenu.style.left = '0px';
      ctxMenu.style.top = '0px';
      var w = ctxMenu.offsetWidth, h = ctxMenu.offsetHeight;
      // 菜单也留在垫内（同时兜底视口边界）
      var hr = hero.getBoundingClientRect();
      var loX = Math.max(8, hr.left + 8), hiX = Math.min(window.innerWidth, hr.right) - w - 8;
      var loY = Math.max(8, hr.top + 8), hiY = Math.min(window.innerHeight, hr.bottom) - h - 8;
      var x = Math.max(loX, Math.min(lastClient.x + 12, hiX));
      var y = Math.max(loY, Math.min(lastClient.y + 12, hiY));
      ctxMenu.style.left = x + 'px';
      ctxMenu.style.top = y + 'px';
    }
    function ctxHead(text) {
      var head = document.createElement('span');
      head.className = 'head';
      head.textContent = text;
      ctxMenu.appendChild(head);
    }
    function ctxOption(text, handler, extras) {
      extras = extras || {};
      var button = document.createElement('button');
      button.type = 'button';
      if (extras.className) button.className = extras.className;
      var labelSpan = document.createElement('span');
      labelSpan.textContent = text;
      button.appendChild(labelSpan);
      if (extras.key) {
        var keySpan = document.createElement('span');
        keySpan.className = 'key';
        keySpan.textContent = extras.key;
        button.appendChild(keySpan);
      }
      button.addEventListener('click', handler);
      ctxMenu.appendChild(button);
      return button;
    }
    function ctxSep() {
      var el = document.createElement('span');
      el.className = 'sep';
      ctxMenu.appendChild(el);
    }

    function buildShapeOps() {
      var n = shapeSelection.length;
      [['axon', 'Axon'], ['plan', 'Floor Plan'], ['path', 'Toolpath']].forEach(function (spec) {
        var button = ctxOption(spec[1], function () {
          shapeSelection.forEach(function (s) { applyOp(s, spec[0]); });
          syncCtx();
        });
        if (n && shapeSelection.every(function (s) { return s.activeOp === spec[0]; })) {
          button.classList.add('on');
        }
      });
      if (n === 2) {
        ctxSep();
        [['union', 'Union'], ['subtract', 'Difference'], ['intersect', 'Intersect']].forEach(function (spec) {
          ctxOption(spec[1], function () { doBoolean(shapeSelection[0], shapeSelection[1], spec[0]); },
            { className: 'bool' });
        });
      }
      if (n >= 2) {
        ctxSep();
        [['massing', 'Massing'], ['site', 'Site Plan'], ['nest', 'Nesting']].forEach(function (spec) {
          ctxOption(spec[1], function () { applySetOp(spec[0]); });
        });
      }
      ctxSep();
      ctxOption('Rotate 90°', rotateShapes90, { key: 'R' });
      ctxOption('Delete', deleteShapeSelection, { key: 'Del' });
      ctxOption('Distance', startDist);
    }

    function syncCtx() {
      if (!shapeSelection.length || sketchPoints.length || distState
          || (moveState && moveState.moved)
          || frame.classList.contains('has-open-project')) {
        ctxMenu.style.display = 'none';
        return;
      }
      ctxMenu.textContent = '';
      ctxHead(shapeSelection.length + (shapeSelection.length === 1 ? ' Curve' : ' Curves'));
      buildShapeOps();
      placeCtx();
    }

    // 空白处右键：全局工具小菜单
    function showMatMenu() {
      ctxMenu.textContent = '';
      ctxHead('Mat');
      if (shapes.length) ctxOption('Select All', selectAllShapes, { key: 'A' });
      ctxOption('Distance', startDist);
      placeCtx();
    }

    function selectAllShapes() {
      if (shapes.length) setShapeSelection(shapes.slice());
    }

    frame.addEventListener('mousemove', function (event) {
      var pointerX = event.clientX;
      var pointerY = event.clientY;
      var snapped = false;
      var heroRect = hero.getBoundingClientRect();
      var inHero = heroRect.height > 0
        && pointerX >= heroRect.left && pointerX <= heroRect.right
        && pointerY >= heroRect.top && pointerY <= heroRect.bottom;

      if (event.target.closest && event.target.closest('.archive-ctx')) return;

      if (inHero) {
        var picked = pickSketchPoint(pointerX - heroRect.left, pointerY - heroRect.top);
        // 靠近起点时橡皮筋钉到起点上，提示可以闭合
        if (sketchPoints.length && sketchNearStart(picked)) {
          picked = { x: sketchPoints[0].x, y: sketchPoints[0].y, snapped: true };
        }
        pointerX = picked.x + heroRect.left;
        pointerY = picked.y + heroRect.top;
        snapped = picked.snapped;
        sketchCursor = picked;
        lastClient = { x: pointerX, y: pointerY };
        renderSketchDraft();
        updateDrawCell();
        // 测距第二点的实时预览
        if (distState && distState.p1) {
          if (distPreview && distPreview.parentNode) distPreview.parentNode.removeChild(distPreview);
          distPreview = dimNode(distState.p1, picked);
          distPreview.setAttribute('opacity', '.6');
          sketchPaper.appendChild(distPreview);
        }
      } else if (sketchCursor) {
        sketchCursor = null;
        renderSketchDraft();
      }

      tracker.classList.toggle('is-snapped', snapped);
      tracker.style.setProperty('--tracker-x', pointerX + 'px');
      tracker.style.setProperty('--tracker-y', pointerY + 'px');

      if (statusCoords) {
        var matRect = frame.getBoundingClientRect();
        statusCoords.textContent = 'X ' + formatMm((pointerX - matRect.left) / rulerStep * 100)
          + ' Y ' + formatMm((pointerY - matRect.top) / rulerStep * 100) + ' MM';
      }
    });

    // ---------- 状态栏开关：都是真开关，没有摆设 ----------
    if (statusbar) {
      // 状态栏钉在视口底边，但它的静态位置在版心末尾之外；
      // 阻止按下时的聚焦滚动，点开关时页面才不会跳（键盘 Tab 聚焦不受影响）
      statusbar.addEventListener('pointerdown', function (event) {
        if (event.target.closest && event.target.closest('button')) event.preventDefault();
      });
      statusbar.querySelectorAll('[data-statusbar-toggle]').forEach(function (button) {
        button.addEventListener('click', function () {
          var turnOn = button.getAttribute('aria-pressed') !== 'true';
          button.setAttribute('aria-pressed', String(turnOn));
          button.classList.toggle('is-on', turnOn);
          if (button.dataset.statusbarToggle === 'grid') {
            frame.classList.toggle('grid-off', !turnOn);
          } else if (button.dataset.statusbarToggle === 'snap') {
            snapEnabled = turnOn;
            if (!turnOn) tracker.classList.remove('is-snapped');
          } else if (button.dataset.statusbarToggle === 'ortho') {
            orthoLatch = turnOn;
            syncOrthoToggle();
          }
        });
      });
    }

    function updateSelectedCount() {
      if (!statusSelected) return;
      var count = indexHost.querySelectorAll('.archive-project.is-marquee-selected').length;
      statusSelected.textContent = count + ' Selected';
    }

    clearArchiveSelection = function () {
      indexHost.querySelectorAll('.archive-project.is-marquee-selected').forEach(function (item) {
        item.classList.remove('is-marquee-selected');
      });
      updateSelectedCount();
    };

    // ---------- CAD 式框选：左→右实线窗选（整行在框内才选中），
    // 右→左虚线叉选（沾到就选中）。只在列表未打开项目时生效 ----------
    var marqueeBox = null;
    var marqueeStart = null;
    var marqueePointer = null;
    var marqueeLive = false;
    var suppressRowClick = false;
    var MARQUEE_THRESHOLD = 5;   // 位移超过这个像素数才算拖框，否则仍是点击

    function applyMarquee(currentX, currentY) {
      var rect = {
        left: Math.min(marqueeStart.x, currentX),
        top: Math.min(marqueeStart.y, currentY),
        right: Math.max(marqueeStart.x, currentX),
        bottom: Math.max(marqueeStart.y, currentY),
        crossing: currentX < marqueeStart.x   // 往左拖 = 叉选
      };

      if (!marqueeBox) {
        marqueeBox = archiveNode('div', 'archive-marquee');
        marqueeBox.setAttribute('aria-hidden', 'true');
        frame.appendChild(marqueeBox);
      }
      marqueeBox.style.display = 'block';
      marqueeBox.style.left = rect.left + 'px';
      marqueeBox.style.top = rect.top + 'px';
      marqueeBox.style.width = (rect.right - rect.left) + 'px';
      marqueeBox.style.height = (rect.bottom - rect.top) + 'px';
      marqueeBox.classList.toggle('is-crossing', rect.crossing);

      var hitCount = 0;
      indexHost.querySelectorAll('.archive-project:not([hidden])').forEach(function (item) {
        var row = item.querySelector('button.archive-row');
        if (!row) return;
        var rowRect = row.getBoundingClientRect();
        var overlaps = rowRect.right > rect.left && rowRect.left < rect.right
          && rowRect.bottom > rect.top && rowRect.top < rect.bottom;
        // 行是横向通栏对象，窗选的“全含”按纵向判定；叉选沾边即中
        var hit = rect.crossing
          ? overlaps
          : overlaps && rowRect.top >= rect.top && rowRect.bottom <= rect.bottom;
        if (hit) hitCount++;
        item.classList.toggle('is-marquee-selected', hit);
      });
      // 框角标签实时说明当前模式和命中数
      marqueeBox.setAttribute('data-marquee-label',
        (rect.crossing ? 'Crossing' : 'Window') + ' · ' + hitCount);
      updateSelectedCount();
    }

    function endMarquee(cancelled) {
      if (marqueePointer !== null && frame.hasPointerCapture
          && frame.hasPointerCapture(marqueePointer)) {
        frame.releasePointerCapture(marqueePointer);
      }
      if (marqueeBox) marqueeBox.style.display = 'none';
      frame.classList.remove('is-marquee-dragging');
      if (cancelled) clearArchiveSelection();
      // 松手后浏览器会补发一次 click，拦下来别让它展开项目行
      if (marqueeLive) suppressRowClick = true;
      marqueeLive = false;
      marqueeStart = null;
      marqueePointer = null;
    }

    // 行框选只在切割垫以外起手（hero 有自己的形状手势）
    frame.addEventListener('pointerdown', function (event) {
      if (!finePointer || event.button !== 0) return;
      // 项目展开后是阅读模式，保持纯点击语义
      if (indexSection.classList.contains('has-open-project')) return;
      // 状态栏、链接、上下文菜单保持原生行为
      if (event.target.closest && event.target.closest('.archive-statusbar, .hero-zoom, a, .archive-ctx')) return;
      // 非按钮区域按下即接管默认行为：原生蓝色文字选择不再出现
      if (!(event.target.closest && event.target.closest('button'))) event.preventDefault();
      // hero 内的手势（画/选/拖/框选形状）归 hero 的处理器
      if (hero.contains(event.target)) return;
      marqueeStart = { x: event.clientX, y: event.clientY };
      marqueePointer = event.pointerId;
      marqueeLive = false;
    });

    frame.addEventListener('pointermove', function (event) {
      if (marqueeStart === null || event.pointerId !== marqueePointer) return;
      if (!marqueeLive) {
        if (Math.abs(event.clientX - marqueeStart.x) < MARQUEE_THRESHOLD
            && Math.abs(event.clientY - marqueeStart.y) < MARQUEE_THRESHOLD) return;
        marqueeLive = true;
        frame.classList.add('is-marquee-dragging');
        // 起手那几像素可能已经拖出一点原生选区，清掉
        if (window.getSelection) window.getSelection().removeAllRanges();
        if (frame.setPointerCapture) frame.setPointerCapture(marqueePointer);
      }
      event.preventDefault();
      applyMarquee(event.clientX, event.clientY);
    });

    frame.addEventListener('pointerup', function (event) {
      if (marqueeStart === null || event.pointerId !== marqueePointer) return;
      endMarquee(false);
    });
    frame.addEventListener('pointercancel', function (event) {
      if (marqueeStart === null || event.pointerId !== marqueePointer) return;
      endMarquee(true);
    });

    // 拖框收尾的那次 click 只做清理，不再传给行按钮
    frame.addEventListener('click', function (event) {
      if (!suppressRowClick) return;
      suppressRowClick = false;
      event.stopPropagation();
      event.preventDefault();
    }, true);

    // ---------- hero 手势：单击落点 / 点边拾取 / 拖动移动或框选形状 / 右键菜单 ----------
    var shapeMqBox = null;
    var shapeMqStart = null;   // {x, y, shift} hero 局部
    var shapeMqLive = false;

    if (sketchPaper && finePointer) {
      shapeMqBox = archiveNode('div', 'archive-shape-marquee');
      shapeMqBox.setAttribute('aria-hidden', 'true');
      hero.appendChild(shapeMqBox);

      hero.addEventListener('pointerdown', function (event) {
        if (event.button !== 0) return;
        if (event.target.closest && event.target.closest('.archive-hero-tools, .archive-ruler')) return;
        var heroRect = hero.getBoundingClientRect();
        var local = { x: event.clientX - heroRect.left, y: event.clientY - heroRect.top };
        heroDownAt = { x: event.clientX, y: event.clientY };
        if (sketchPoints.length || distState) return;   // 绘制/测距中不启动移动或框选
        // 按在轮廓线上 = 潜在的移动拖拽；没拖动就是普通拾取（click 处理）
        var grab = shapeAtEdge(local);
        if (grab) {
          var moveList = shapeSelection.indexOf(grab) > -1 ? shapeSelection.slice() : [grab];
          // 记录整组包围盒，拖动时钳制在垫内
          var mb = { minX: 1e9, minY: 1e9, maxX: -1e9, maxY: -1e9 };
          moveList.forEach(function (s) {
            var b = polyBounds(s.points);
            mb.minX = Math.min(mb.minX, b.minX); mb.minY = Math.min(mb.minY, b.minY);
            mb.maxX = Math.max(mb.maxX, b.maxX); mb.maxY = Math.max(mb.maxY, b.maxY);
          });
          moveState = {
            grab: grab, list: moveList, bbox: mb,
            startX: event.clientX, startY: event.clientY,
            dx: 0, dy: 0, moved: false
          };
          return;
        }
        shapeMqStart = { x: local.x, y: local.y, shift: event.shiftKey };
        shapeMqLive = false;
      });

      hero.addEventListener('pointermove', function (event) {
        if (moveState) {
          var mdx = event.clientX - moveState.startX;
          var mdy = event.clientY - moveState.startY;
          if (!moveState.moved) {
            if (Math.hypot(mdx, mdy) <= CLICK_SLOP) return;
            moveState.moved = true;
            if (shapeSelection.indexOf(moveState.grab) === -1) setShapeSelection([moveState.grab]);
            clearSetOutput();   // 组处理输出跟不上移动，先撤
            syncCtx();
          }
          // 正交约束到轴向，吸附把位移量整到网格步距
          if (orthoActive()) { if (Math.abs(mdx) >= Math.abs(mdy)) mdy = 0; else mdx = 0; }
          if (snapEnabled) {
            mdx = Math.round(mdx / snapUnit) * snapUnit;
            mdy = Math.round(mdy / snapUnit) * snapUnit;
          }
          // 允许拖出垫外——越界部分被垫子边界裁掉（上层元素盖住）；
          // 但整组至少留 24px 在垫内，永远有一段轮廓能抓回来
          var KEEP = 24;
          var mb = moveState.bbox;
          mdx = Math.max(KEEP - mb.maxX, Math.min(hero.clientWidth - KEEP - mb.minX, mdx));
          mdy = Math.max(20 + KEEP - mb.maxY, Math.min(hero.clientHeight - KEEP - mb.minY, mdy));
          moveState.dx = mdx;
          moveState.dy = mdy;
          moveState.list.forEach(function (s) {
            s.g.setAttribute('transform', 'translate(' + mdx + ' ' + mdy + ')');
          });
          return;
        }
        if (!shapeMqStart) return;
        var heroRect = hero.getBoundingClientRect();
        var lx = event.clientX - heroRect.left;
        var ly = event.clientY - heroRect.top;
        if (!shapeMqLive && Math.hypot(lx - shapeMqStart.x, ly - shapeMqStart.y) <= CLICK_SLOP) return;
        shapeMqLive = true;
        shapeMqBox.style.display = 'block';
        shapeMqBox.style.left = Math.min(shapeMqStart.x, lx) + 'px';
        shapeMqBox.style.top = Math.min(shapeMqStart.y, ly) + 'px';
        shapeMqBox.style.width = Math.abs(lx - shapeMqStart.x) + 'px';
        shapeMqBox.style.height = Math.abs(ly - shapeMqStart.y) + 'px';
        shapeMqBox.classList.toggle('is-crossing', lx < shapeMqStart.x);
      });

      function endHeroPointer(event, cancelled) {
        if (moveState) {
          if (moveState.moved && !cancelled) {
            var mdx = moveState.dx, mdy = moveState.dy;
            moveState.list.forEach(function (s) {
              s.g.removeAttribute('transform');
              transformShape(s, function (p) { return { x: p.x + mdx, y: p.y + mdy }; });
            });
            lastClient = { x: event.clientX, y: event.clientY };
          } else {
            moveState.list.forEach(function (s) { s.g.removeAttribute('transform'); });
          }
          moveState = null;
          syncCtx();
          return;
        }
        if (!shapeMqStart) return;
        if (shapeMqLive && !cancelled) {
          var heroRect = hero.getBoundingClientRect();
          var lx = event.clientX - heroRect.left;
          var ly = event.clientY - heroRect.top;
          var sel = {
            left: Math.min(shapeMqStart.x, lx), top: Math.min(shapeMqStart.y, ly),
            right: Math.max(shapeMqStart.x, lx), bottom: Math.max(shapeMqStart.y, ly),
            crossing: lx < shapeMqStart.x
          };
          var hit = shapes.filter(function (s) {
            var b = polyBounds(s.points);
            var overlaps = b.maxX > sel.left && b.minX < sel.right
              && b.maxY > sel.top && b.minY < sel.bottom;
            return sel.crossing
              ? overlaps
              : b.minX >= sel.left && b.maxX <= sel.right && b.minY >= sel.top && b.maxY <= sel.bottom;
          });
          lastClient = { x: event.clientX, y: event.clientY };
          setShapeSelection(shapeMqStart.shift ? shapeSelection.concat(hit) : hit);
        }
        shapeMqBox.style.display = 'none';
        shapeMqStart = null;
        shapeMqLive = false;
      }
      hero.addEventListener('pointerup', function (event) { endHeroPointer(event, false); });
      hero.addEventListener('pointercancel', function (event) { endHeroPointer(event, true); });

      hero.addEventListener('click', function (event) {
        // 刻度尺和筛选工具区不落点
        if (event.target.closest && event.target.closest('.archive-hero-tools, .archive-ruler')) return;
        if (heroDownAt && Math.hypot(event.clientX - heroDownAt.x, event.clientY - heroDownAt.y) > CLICK_SLOP) return;
        var heroRect = hero.getBoundingClientRect();
        var raw = { x: event.clientX - heroRect.left, y: event.clientY - heroRect.top };
        lastClient = { x: event.clientX, y: event.clientY };
        var pt = pickSketchPoint(raw.x, raw.y);

        // 测距模式优先接管点击
        if (distState) { handleDistClick(pt); return; }

        // 空闲时点在轮廓线上 = 拾取；绘制进行中点击永远落点，想拾取先收笔
        if (!sketchPoints.length) {
          var hitShape = shapeAtEdge(raw);
          if (hitShape) {
            if (event.shiftKey) toggleShapeSelect(hitShape);
            else setShapeSelection([hitShape]);
            return;
          }
          // 有选择时点空白 = 只取消选择、收起菜单，这一下不落点（Blender 语义）
          if (shapeSelection.length) { setShapeSelection([]); return; }
        }

        if (sketchNearStart(pt)) { finishSketch(true); return; }
        var last = sketchPoints[sketchPoints.length - 1];
        if (last && Math.hypot(pt.x - last.x, pt.y - last.y) < 2) return; // 双击的第二下不重复落点
        sketchPoints.push(pt);
        renderSketchDraft();
        updateDrawCell();
      });

      hero.addEventListener('dblclick', function (event) {
        if (event.target.closest && event.target.closest('.archive-hero-tools, .archive-ruler')) return;
        if (sketchPoints.length) finishSketch(false);
      });

      // 右键：绘制中 = 完成（Rhino）；空闲 = 唤出上下文菜单（Blender）
      hero.addEventListener('contextmenu', function (event) {
        if (event.target.closest && event.target.closest('.archive-hero-tools, .archive-ruler')) return;
        event.preventDefault();
        var heroRect = hero.getBoundingClientRect();
        var local = { x: event.clientX - heroRect.left, y: event.clientY - heroRect.top };
        lastClient = { x: event.clientX, y: event.clientY };
        if (sketchPoints.length) { finishSketch(false); return; }
        if (distState) { cancelDist(); return; }
        var hitShape = shapeAtEdge(local);
        if (hitShape && shapeSelection.indexOf(hitShape) === -1) {
          setShapeSelection([hitShape]);
          return;
        }
        if (shapeSelection.length) { syncCtx(); return; }
        showMatMenu();
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Shift') { shiftHeld = true; syncOrthoToggle(); }
        if (frame.classList.contains('has-open-project')) return;
        if (event.key === 'Enter' && sketchPoints.length) finishSketch(false);
        // 绘制中 Ctrl+Z 逐点撤销
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z' && sketchPoints.length) {
          event.preventDefault();
          sketchPoints.pop();
          renderSketchDraft();
          updateDrawCell();
        }
        if ((event.key === 'Delete' || event.key === 'Backspace')
            && shapeSelection.length && !sketchPoints.length) {
          deleteShapeSelection();
        }
        // Blender 的 R：旋转选中 90°；A：全选
        if ((event.key === 'r' || event.key === 'R') && shapeSelection.length && !sketchPoints.length
            && !distState && !event.ctrlKey && !event.metaKey && !event.altKey) {
          rotateShapes90();
        }
        if ((event.key === 'a' || event.key === 'A') && !sketchPoints.length && !distState
            && !event.ctrlKey && !event.metaKey && !event.altKey) {
          selectAllShapes();
        }
        // AutoCAD 功能键：F7 网格 / F8 正交 / F9 吸附
        if (event.key === 'F7' || event.key === 'F8' || event.key === 'F9') {
          event.preventDefault();
          var kind = event.key === 'F7' ? 'grid' : (event.key === 'F8' ? 'ortho' : 'snap');
          var toggle = statusbar ? statusbar.querySelector('[data-statusbar-toggle="' + kind + '"]') : null;
          if (toggle) toggle.click();
        }
      });
      document.addEventListener('keyup', function (event) {
        if (event.key === 'Shift') { shiftHeld = false; syncOrthoToggle(); }
      });
    }

    // ---------- ESC 的 CAD 语义：一次取消一层 ----------
    document.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape' || event.altKey || event.ctrlKey || event.metaKey) return;
      // 测距中：退出测距
      if (distState) { cancelDist(); return; }
      // 正在落点：取消这条未完成的线
      if (sketchPoints.length) { cancelSketch(); return; }
      // 正在拖形状框选：取消
      if (shapeMqLive) {
        if (shapeMqBox) shapeMqBox.style.display = 'none';
        shapeMqStart = null;
        shapeMqLive = false;
        return;
      }
      // 有形状选中：清空形状选择（菜单随之收起）
      if (shapeSelection.length) { setShapeSelection([]); return; }
      // 正在拖行框选：取消
      if (marqueeLive) { endMarquee(true); return; }
      // 有行框选结果：清空
      if (indexHost.querySelector('.archive-project.is-marquee-selected')) {
        clearArchiveSelection();
        return;
      }
      // 有展开的项目：收回列表并回到档案首屏
      if (indexHost.querySelector('.archive-project.is-open')) {
        collapseArchiveWorkspace(indexHost, true);
        return;
      }
      // 垫上还有形/墨迹：清场
      if (shapes.length || (sketchPaper && sketchPaper.childNodes.length > 1)) {
        clearAllShapes();
        return;
      }
      // 有激活的职业方向筛选：回到 All
      if (activeTrack !== 'all') applyTrack('all');
    });

    var upwardWheelIntent = 0;
    var downwardWheelIntent = 0;
    var lastUpwardWheel = 0;
    var lastDownwardWheel = 0;
    var topCollapseThreshold = 160;
    var topIntentWindow = 520;
    var downwardExpandThreshold = 180;
    var downwardExpandWindow = 620;

    frame.addEventListener('wheel', function (event) {
      var activeDetail = workspace.querySelector('.archive-detail.is-open');
      if (event.ctrlKey || event.deltaY === 0) {
        upwardWheelIntent = 0;
        downwardWheelIntent = 0;
        return;
      }

      var wheelDistance = Math.abs(event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY);
      var now = Date.now();

      if (!activeDetail) {
        upwardWheelIntent = 0;
        if (event.deltaY < 0) {
          downwardWheelIntent = 0;
          return;
        }

        var frameBottom = frame.getBoundingClientRect().bottom;
        var pageBottom = (window.scrollY || window.pageYOffset || 0) + window.innerHeight;
        var isAtCollapsedBottom = frameBottom <= window.innerHeight + 2
          || pageBottom >= document.documentElement.scrollHeight - 2;
        if (!isAtCollapsedBottom) {
          downwardWheelIntent = 0;
          return;
        }

        event.preventDefault();
        if (now - lastDownwardWheel > downwardExpandWindow) downwardWheelIntent = 0;
        lastDownwardWheel = now;
        downwardWheelIntent += wheelDistance;
        if (downwardWheelIntent < downwardExpandThreshold) return;

        downwardWheelIntent = 0;
        expandArchiveWorkspace(indexHost);
        return;
      }

      if (event.deltaY < 0) {
        downwardWheelIntent = 0;
        var sectionTop = indexSection.getBoundingClientRect().top;
        var distanceToWorkspaceTop = Math.max(0, -sectionTop);

        if (distanceToWorkspaceTop > wheelDistance + 2) {
          upwardWheelIntent = 0;
          return;
        }

        event.preventDefault();
        pinArchiveWorkspaceTop(indexSection);

        if (now - lastUpwardWheel > topIntentWindow) upwardWheelIntent = 0;
        lastUpwardWheel = now;
        upwardWheelIntent += Math.max(0, wheelDistance - distanceToWorkspaceTop);
        if (upwardWheelIntent < topCollapseThreshold) return;

        upwardWheelIntent = 0;
        collapseArchiveWorkspace(indexHost, true);
        return;
      }

      upwardWheelIntent = 0;
      downwardWheelIntent = 0;
    }, { passive: false });

    buildArchiveRuler();
    window.addEventListener('resize', buildArchiveRuler);
  }

  // ---------- MP-01 切割垫式作品档案索引 ----------
  var f0 = tpl('tpl-preserve');
  f0.id = 'f-00';
  main.appendChild(f0);
  filterHost = f0.querySelector('#track-filters');
  populateArchiveProfile(f0);
  setupArchiveFrame(f0);

  // ---------- MP-02 作品页，一个项目一页 ----------
  projects.forEach(function (p, i) {
    var n = tpl('tpl-work');
    n.id = 'f-' + pad(i + 1);
    n.dataset.projectId = p.id;
    n.dataset.label = p.title || ('Project ' + pad(i + 1));
    n.dataset.tracks = (p.tracks || []).join(' ');
    n.dataset.primaryTrack = p.primary_track || '';
    var primaryTrack = trackById[p.primary_track] || {};
    if (primaryTrack.color) n.style.setProperty('--project-track-color', primaryTrack.color);

    fill(n, 'index', 'Archive File ' + pad(i + 1));
    fill(n, 'track', trackById[p.primary_track] ? trackById[p.primary_track].label : '');
    fill(n, 'title', p.title);
    fill(n, 'subtitle', p.subtitle);
    fill(n, 'year', p.year);
    fill(n, 'type', p.type);
    fill(n, 'tools', p.tools);
    fill(n, 'body', p.body);
    // 图注不上页面，连同它占的那一行空间一起去掉；文本仍保留在 projects.csv 里
    fill(n, 'caption', '');

    // 元信息表里被移除的 dd，对应的 dt 也要一起去掉
    var dl = n.querySelector('.work__meta dl');
    if (dl) {
      ['year', 'type', 'tools'].forEach(function (k) {
        if (!p[k]) {
          var dts = dl.querySelectorAll('dt');
          for (var j = 0; j < dts.length; j++) {
            if (dts[j].textContent.toLowerCase() === k) { dl.removeChild(dts[j]); break; }
          }
        }
      });
      if (!dl.querySelector('dt')) { dl.parentNode.parentNode.removeChild(dl.parentNode); }
    }

    // 链接：CSV 里为空就不显示按钮
    var a = slot(n, 'link');
    if (a) {
      if (p.link) { a.href = p.link; a.target = '_blank'; a.rel = 'noopener'; if (p.id === 'p18') a.textContent = 'Open configurator ↗'; }
      else { a.parentNode.removeChild(a); }
    }

    // 仓库地址单独一个按钮，文字直接显示 owner/repo，比 "Repository" 有信息量
    var repoLink = slot(n, 'repo');
    if (repoLink) {
      if (p.repo) {
        repoLink.href = p.repo;
        repoLink.target = '_blank';
        repoLink.rel = 'noopener';
        var repoPath = p.repo.replace(/^https?:\/\/(www\.)?github\.com\//i, '')
                             .replace(/\/+$/, '');
        repoLink.textContent = repoPath || 'Repository';
      } else {
        repoLink.parentNode.removeChild(repoLink);
      }
    }

    // 两个按钮都没有就把容器一起收掉，不留空行
    var linkRow = n.querySelector('.work__links');
    if (linkRow && !linkRow.querySelector('a')) linkRow.parentNode.removeChild(linkRow);

    var mainFigure = slot(n, 'figure');
    // 不自动播放：autoplay 会压过 preload='metadata'，让 12 个项目的主视频
    // 在没人点开的时候就被完整下载（实测首屏因此多下 8 MB）。
    // 改成展开项目时再播，见 setArchiveState。
    var mainMedia = setMedia(mainFigure, p.main, p.title, 'Main media', {
      controls: true,
      autoplay: false,
      defer: true
    });
    requestHeroMediaFit(mainFigure, mainMedia);
    // 内嵌页面自带交互，不套用图片缩放控件
    if (mainMedia && mainMedia.tagName !== 'IFRAME') setupHeroZoom(mainFigure);
    n.dataset.imageCount = p.image_count || ((p.main ? 1 : 0) + (p.thumbs || []).length);

    // 文件夹里有多少附图就生成多少张；加载后按实际比例重新平衡瀑布流。
    var thumbs = slot(n, 'thumbs');
    if (thumbs) {
      // 主图也占一格：否则缩略图条的数量和项目实际媒体数对不上。
      var list = (p.main ? [p.main] : []).concat(p.thumbs || []);
      // The live desk is already interactive above; its gallery shows model views.
      if (p.id === 'p18') list = (p.thumbs || []).slice();
      // 灯箱与页面缩略图共用同一清单，确保每个灯箱项目都有可见入口。
      var lightboxItems = list.slice();
      if (!list.length) {
        thumbs.parentNode.removeChild(thumbs);
      } else {
        list.forEach(function (src, thumbIndex) {
          var cell = document.createElement('div');
          cell.tabIndex = 0;
          cell.setAttribute('role', 'button');
          cell.setAttribute(
            'aria-label',
            isPdfSource(src) ? 'Open PDF: ' + mediaFileName(src) : 'View project media'
          );
          var thumbnailMedia = setMedia(cell, src, '', '', {
            autoplay: !reduceMotion,
            defer: true
          });
          bindMasonryMedia(thumbs, thumbnailMedia);
          // HTML 内嵌页缩略图：按格子宽度整体缩放，保持设计版式。
          // PDF 缩略图使用轻量文档卡，不走 iframe 缩放。
          if (thumbnailMedia && thumbnailMedia.tagName === 'IFRAME'
              && !thumbnailMedia.classList.contains('media-pdf-frame')) {
            var fitThumb = function () {
              var w = cell.clientWidth;
              if (!w) return;
              fitEmbedFrame(thumbnailMedia, w, w * EMBED_LOGICAL_HEIGHT / EMBED_LOGICAL_WIDTH);
              requestMasonryLayout(thumbs);
            };
            fitThumb();
            if (window.ResizeObserver) new window.ResizeObserver(fitThumb).observe(cell);
          }
          var openHere = function () {
            openLightbox(lightboxItems, thumbIndex, p.title || '', cell);
          };
          cell.addEventListener('click', openHere);
          cell.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              openHere();
            }
          });
          thumbs.appendChild(cell);
        });
        requestMasonryLayout(thumbs);
      }
    }

    var archiveClip = f0.querySelector('#archive-panel-' + pad(i + 1) + ' .archive-detail__clip');
    if (archiveClip) archiveClip.appendChild(n);
    else main.appendChild(n);
  });

  // ---------- 职业方向高亮 ----------
  var allFrames = Array.prototype.slice.call(main.querySelectorAll('.frame'));
  var filterButtons = [];
  var activeTrack = 'all';
  var baseTitle = document.title;
  var archiveIndexHost = f0.querySelector('[data-archive-index]');
  // 记录一次初始顺序，作为切回 All 时的还原基准
  var archiveOriginalOrder = archiveIndexHost
    ? Array.prototype.slice.call(archiveIndexHost.querySelectorAll('.archive-project'))
    : [];

  function archiveItemForFrame(frame) {
    if (!frame) return null;
    var directItem = frame.closest('.archive-project');
    if (directItem) return directItem;
    var detail = frame.closest('.archive-detail');
    var triggerId = detail ? detail.getAttribute('aria-labelledby') : '';
    var trigger = triggerId ? document.getElementById(triggerId) : null;
    return trigger ? trigger.closest('.archive-project') : null;
  }

  function revealEmbeddedProject(frame, shouldScroll) {
    if (!frame) return;
    var item = archiveItemForFrame(frame);
    if (!item) {
      if (shouldScroll) frame.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
      return;
    }

    item.parentNode.querySelectorAll('.archive-project').forEach(function (current) {
      setArchiveState(current, current === item);
    });
    syncArchiveLayout(item.parentNode);

    if (shouldScroll) alignArchiveWorkspace(item.parentNode);
  }

  function projectCount(trackId) {
    return projects.filter(function (project) {
      return trackId === 'all' || (project.tracks || []).indexOf(trackId) !== -1;
    }).length;
  }

  // 掀页飞行的动效参数
  var FLIP_DURATION = 760;       // 单行飞行时长
  var FLIP_STAGGER = 44;         // 相邻行的出发间隔
  var FLIP_STAGGER_MAX = 9;      // 最多错开几档，长列表尾部才不用干等
  var FLIP_FULL_TRAVEL = 420;    // 飞满这个距离就用满幅动作
  var FLIP_SWING_RATIO = .075;   // 横向绕行幅度占列表宽度的比例
  var FLIP_SWING_MIN = 18;       // 窄屏也要看得出在绕
  var FLIP_SWING_MAX = 68;       // 宽屏不至于飞过头
  var FLIP_SWEEP_BUFFER = 140;   // 扫尾比动画多留的余量

  // 清掉一行的掀页态：取消动画、去掉临时类
  function clearFlipState(item) {
    if (item._flipAnimation) {
      item._flipAnimation.cancel();
      item._flipAnimation = null;
    }
    item.classList.remove('is-flipping');
    item.classList.remove('is-flipping--lift');
  }

  // 飞行姿态：透视 + 位移 + 离屏高度 + 绕横轴掀起 + 绕纸面轻晃
  function flipPose(x, y, z, tilt, roll) {
    return 'perspective(900px) translate3d(' + x + 'px, ' + y + 'px, ' + z + 'px)'
      + ' rotateX(' + tilt + 'deg) rotateZ(' + roll + 'deg)';
  }

  // 命中的项目按原相对顺序排到顶部，其余保持原顺序留在下方，用 FLIP 做掀页飞行
  function sortArchiveRows(trackId) {
    if (!archiveIndexHost || archiveOriginalOrder.length < 2) return;

    var matched = [];
    var rest = [];
    archiveOriginalOrder.forEach(function (item) {
      var tracks = (item.dataset.tracks || '').split(' ').filter(Boolean);
      if (trackId !== 'all' && tracks.indexOf(trackId) !== -1) matched.push(item);
      else rest.push(item);
    });

    var nextOrder = matched.concat(rest);
    var current = Array.prototype.slice.call(archiveIndexHost.querySelectorAll('.archive-project'));
    var changed = current.length !== nextOrder.length || current.some(function (item, i) {
      return item !== nextOrder[i];
    });
    if (!changed) return;

    var canAnimate = !reduceMotion && typeof Element.prototype.animate === 'function';

    // First：按当前视觉位置记录（含上一轮没跑完的位移），连点时才接得上
    if (canAnimate) {
      current.forEach(function (item) { item._flipTop = item.getBoundingClientRect().top; });
    }
    // 上一轮动画就地结束，避免叠加，也保证下面量到的是真实布局位置
    current.forEach(clearFlipState);

    // Last：按新顺序一次性落回 DOM
    var fragment = document.createDocumentFragment();
    nextOrder.forEach(function (item) { fragment.appendChild(item); });
    archiveIndexHost.appendChild(fragment);

    if (!canAnimate) return;

    // Invert + Play：先离架掀起，再从侧面绕过彼此，最后落回新位
    // 摆幅取列表宽度的比例，同时不超出列表左侧的可用空间——
    // 桌面端左边是侧栏，能大幅绕出去；窄屏列表贴着屏幕边，就收着飞
    var leftRoom = archiveIndexHost.getBoundingClientRect().left;
    var swingMax = Math.max(FLIP_SWING_MIN, Math.min(
      FLIP_SWING_MAX,
      (archiveIndexHost.clientWidth || 800) * FLIP_SWING_RATIO,
      leftRoom + FLIP_SWING_MIN
    ));
    var step = 0;
    var lastDelay = 0;
    nextOrder.forEach(function (item) {
      var delta = item._flipTop - item.getBoundingClientRect().top;
      item._flipTop = 0;
      if (Math.abs(delta) < 1) return;   // 位置没动的行不参与，飞的才显眼

      var rising = delta > 0;                                    // 正值＝要往上飞
      var travel = Math.min(1, Math.abs(delta) / FLIP_FULL_TRAVEL);
      var side = rising ? -1 : 1;                                // 上行绕左、下行绕右，才不会撞在一起
      var swing = side * swingMax * (.55 + .45 * travel);        // 横向绕行幅度
      var lift = rising ? 36 + 44 * travel : 20 + 24 * travel;   // 离屏高度，上行抬得更高
      var tilt = (rising ? -1 : 1) * (11 + 12 * travel);         // 绕横轴掀起
      var roll = side * (1.4 + 2 * travel);                      // 绕纸面轻晃，像书页

      lastDelay = Math.min(step, FLIP_STAGGER_MAX) * FLIP_STAGGER;
      step++;

      item.classList.add('is-flipping');
      if (rising) item.classList.add('is-flipping--lift');

      item._flipAnimation = item.animate([
        // 停在原位，平放
        { transform: flipPose(0, delta, 0, 0, 0), easing: 'cubic-bezier(.36, 0, .28, 1)' },
        // 离架：掀起来并抬到半空
        { transform: flipPose(swing * 0.78, delta * 0.84, lift, tilt, roll), offset: .24, easing: 'cubic-bezier(.45, 0, .55, 1)' },
        // 巡航：从侧面绕过对面的书
        { transform: flipPose(swing * 0.52, delta * 0.26, lift * 0.82, tilt * 0.5, roll * 0.65), offset: .64, easing: 'cubic-bezier(.22, 1, .36, 1)' },
        // 落位
        { transform: flipPose(0, 0, 0, 0, 0) }
      ], {
        duration: FLIP_DURATION,
        delay: lastDelay,
        easing: 'linear',   // 让上面每段自己的 easing 说了算
        fill: 'backwards'
      });
    });

    // 统一收尾：不依赖 finish 事件——页面切到后台时时间轴会冻结，事件不会触发
    if (archiveIndexHost._flipSweep) window.clearTimeout(archiveIndexHost._flipSweep);
    archiveIndexHost._flipSweep = window.setTimeout(function () {
      archiveIndexHost._flipSweep = 0;
      nextOrder.forEach(clearFlipState);
    }, lastDelay + FLIP_DURATION + FLIP_SWEEP_BUFFER);
  }

  function applyTrack(trackId) {
    if (trackId !== 'all' && !trackById[trackId]) return;
    activeTrack = trackId;
    var definition = trackById[trackId];

    allFrames.forEach(function (frame) {
      frame.hidden = false;
      var archiveItem = archiveItemForFrame(frame);
      if (archiveItem) archiveItem.hidden = false;
    });

    f0.querySelectorAll('.archive-project').forEach(function (item) {
      var tracks = (item.dataset.tracks || '').split(' ').filter(Boolean);
      var isMatch = trackId !== 'all' && tracks.indexOf(trackId) !== -1;
      item.classList.toggle('is-track-match', isMatch);
      item.classList.toggle('is-track-dimmed', trackId !== 'all' && !isMatch);
      item.style.removeProperty('--active-track-color');
      if (isMatch && definition && definition.color) {
        item.style.setProperty('--active-track-color', definition.color);
      }
    });

    sortArchiveRows(trackId);
    syncArchiveLayout(f0.querySelector('[data-archive-index]'));
    // 列表重排后旧的框选结果失去意义，直接清空；悬停抽屉也先收起
    clearArchiveSelection();
    if (f0._peek) f0._peek.hide();

    filterButtons.forEach(function (button) {
      button.setAttribute('aria-pressed', button.dataset.track === activeTrack ? 'true' : 'false');
    });

    var label = definition ? definition.label : 'All Projects';
    document.documentElement.dataset.portfolioTrack = trackId;
    document.title = trackId === 'all' ? baseTitle : 'Deying Chen — ' + label;
  }

  if (filterHost) {
    [{ id: 'all', label: 'All Projects', short_label: 'All', color: 'var(--ink)' }]
      .concat(trackDefinitions)
      .forEach(function (track) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'track-filter';
        button.dataset.track = track.id;
        if (track.color) button.style.setProperty('--track-color', track.color);
        button.textContent = track.short_label || track.label;
        button.title = track.label + ' — ' + projectCount(track.id) + ' projects';
        button.setAttribute('aria-pressed', track.id === 'all' ? 'true' : 'false');
        button.addEventListener('click', function () { applyTrack(track.id); });
        filterHost.appendChild(button);
        filterButtons.push(button);
      });
  }

  applyTrack('all');

  function revealProjectFromHash() {
    var id = window.location.hash.replace(/^#/, '');
    var projectIndex = projects.findIndex(function (project) { return project.id === id; });
    var target = projectIndex >= 0
      ? document.getElementById('f-' + pad(projectIndex + 1))
      : (id ? document.getElementById(id) : null);
    if (target && target.classList.contains('frame--work')) {
      revealEmbeddedProject(target, true);
    }
  }

  window.addEventListener('hashchange', revealProjectFromHash);
  if (/^#(?:f-\d+|p\d+)$/.test(window.location.hash)) revealProjectFromHash();
})();
</script>


</body>
