<style>
/* ==========================================================
   PORTFOLIO — 纵向长条拼接式
   一屏 = 一个 frame，全站只有 3 种 master page：
     MP-01  .frame--archive    切割垫式作品档案索引（仅第一屏使用）
     MP-02  .frame--work       作品页（一个项目一页）
     首屏侧栏同时承担个人资料摘要，不再保留独立 About frame
   视觉语言取自 style_guide_dieter_rams.html
   ========================================================== */

/* ---------- Design DNA：墨黑结构、中性纸白、低饱和暗红、技术蓝灰网格 ---------- */
:root {
  --font-sans: 'Inter', sans-serif;
  --font-serif: 'Times New Roman', serif;
  --paper:   #FFFFFF;   /* DNA secondary：纯白纸张 */
  --surface: #FFFFFF;   /* DNA surface：与底纸统一，以结构线建立层次 */
  --ink:     #111417;   /* DNA primary：略带冷感的墨黑 */
  --rule:    #58616A;   /* DNA neutral：蓝灰结构分隔线 */
  --mute:    #58616A;   /* DNA neutral：次级文字 */
  --quiet:   #D5DBE0;   /* DNA neutral：弱线与关闭态 */
  --accent:  #9A3330;   /* DNA accent：小面积专业强调 */
  --info:    #405A65;   /* DNA semantic info：技术网格 */
  --signal:  #3D5C49;   /* DNA semantic success：材料与制造 */

  --u: clamp(8px, 0.416667vw, 16px);     /* 1080P–4K 连续缩放的基准节奏 */
  --hair: 1px solid var(--rule);
  --quiet-hair: 1px solid var(--quiet);
  --fs-micro: clamp(9px, 0.42vw, 12px);
  --fs-caption: clamp(11px, 0.56vw, 15px);
  --fs-ui: clamp(13px, 0.72vw, 20px);
  --fs-small: clamp(12px, 0.64vw, 17px);
  --fs-body: clamp(14px, 0.78vw, 21px);
  --fs-title: clamp(28px, 1.8vw, 54px);
  --fs-display: clamp(34px, 2.1vw, 64px);

  --top-offset: 0px;                     /* sticky 项目 tab 贴合视口顶边 */
  --gutter: clamp(20px, 3.25vw, 72px);   /* 随显示器宽度变化的页面留白 */
  --maxw: none;                          /* 内容使用完整可视宽度 */
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: var(--fs-body);
  line-height: 1.55;
  letter-spacing: 0.005em;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

img { display: block; max-width: 100%; }
[hidden] { display: none !important; }

/* ==========================================================
   全局构件：Hero 职业方向筛选
   ========================================================== */

.portfolio-tools {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: calc(var(--u) * 1.25);
}
.track-filters {
  min-width: 0;
  display: flex;
  /* 窄屏放不下就换行——滚动条是隐藏的，横向滚动会让最后一个 chip 无从发现 */
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: calc(var(--u) * 0.5);
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
}
.track-filters::-webkit-scrollbar { display: none; }
.track-filter {
  appearance: none;
  min-height: 32px;
  border: var(--quiet-hair);
  border-radius: 0;
  background: transparent;
  padding: 0 calc(var(--u) * 1.1);
  color: var(--mute);
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-micro);
  line-height: 1;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
  cursor: pointer;
}
.track-filter {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.track-filter:not([data-track="all"]) {
  border-color: var(--track-color, var(--quiet));
  color: var(--track-color, var(--mute));
}
.track-filter:not([data-track="all"])::before {
  content: '';
  flex: 0 0 auto;
  width: 5px;
  height: 5px;
  background: var(--track-color, var(--mute));
}
.track-filter:hover {
  border-color: var(--ink);
  color: var(--ink);
}
.track-filter[aria-pressed="true"] {
  border-color: var(--track-color, var(--accent));
  background: var(--track-color, var(--accent));
  color: var(--paper);
}
.track-filter[aria-pressed="true"]::before { background: currentColor; }
.track-filter:not([data-track="all"]):not([aria-pressed="true"]):hover {
  border-color: var(--track-color);
  color: var(--track-color);
}
.track-filter:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
/* ==========================================================
   FRAME 基类：一屏一个，纵向拼接
   ========================================================== */

.frame {
  position: relative;
  min-height: 100vh;
  padding: calc(var(--top-offset) + var(--u) * 8) var(--gutter) calc(var(--u) * 10);
  border-bottom: var(--hair);
  display: flex;
  flex-direction: column;
}
.frame:last-of-type { border-bottom: 0; }

/* 每个 frame 左上角的编号标签 */
.frame__tag {
  position: absolute;
  top: calc(var(--top-offset) + var(--u) * 3);
  left: var(--gutter);
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-caption);
  letter-spacing: 0.16em;
  color: var(--mute);
  text-transform: uppercase;
}

/* frame 内部统一的居中容器 */
.frame__inner {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* ==========================================================
   MP-01  .frame--archive —— 切割垫式作品档案索引
   ========================================================== */

/* 档案页 token 放在 :root：灯箱挂在 body 下，也要取得到这些值 */
:root {
  --archive-bg: #FAFAF8;
  --archive-surface: #FFFFFF;
  --archive-ink: #121415;
  --archive-accent: #9A3330;
  --archive-muted: #58616A;
  --archive-quiet: #D5DBE0;
  --archive-zone-index: #DADBD7;
  --archive-zone-profile: #EEEEEB;
  --archive-project-hover: #C8CAC5;
  --archive-grid: rgba(64, 90, 101, .035);
  --archive-grid-strong: rgba(64, 90, 101, .08);
  --archive-diagonal: rgba(64, 90, 101, .018);
  --archive-grid-unit: clamp(20px, 1.041667vw, 40px);
  --archive-grid-major: clamp(100px, 5.208333vw, 200px);
  --archive-ruler-step: var(--archive-grid-major);
  --archive-row-height: clamp(46px, 2.395833vw, 92px);
  --archive-directory-meta-height: clamp(48px, 2.5vw, 96px);
  --archive-directory-offset: var(--archive-directory-meta-height);
  --archive-type-region-profile: clamp(10px, .443vw, 17px);
  --archive-type-region-project: clamp(14px, .62vw, 23.8px);
  --archive-type-primary: clamp(12px, .531vw, 20.4px);
  --archive-type-body: clamp(11px, .487vw, 18.7px);
  --archive-type-ui: clamp(10px, .443vw, 17px);
  --archive-type-support: clamp(9px, .398vw, 15.3px);
  --archive-type-label: clamp(8px, .354vw, 13.6px);
  --archive-tracking-region: .1em;
  --archive-tracking-label: .12em;
  --archive-tracking-support: .08em;
  --archive-motion-duration: 720ms;
  --archive-motion-ease: cubic-bezier(.22, 1, .36, 1);
}

.frame--archive {
  min-height: 100vh;
  padding: var(--top-offset) 0 0;
  overflow: visible;
  background: var(--archive-bg);
  color: var(--archive-ink);
  font-family: var(--font-sans);
  font-size: var(--archive-type-body);
  font-weight: 400;
  letter-spacing: .005em;
  line-height: 1.55;
  text-transform: none;
}
/* 十字准星只属于切割垫（grid 区）：其余区域保留系统光标，
   光标形态本身就是“这块可以画”的视觉暗示 */
.frame--archive .archive-hero,
.frame--archive .archive-hero * { cursor: none; }
.frame--archive .archive-hero-tools,
.frame--archive .archive-hero-tools * { cursor: auto; }
.frame--archive .archive-hero-tools .track-filter { cursor: pointer; }

.archive-mat {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: calc(100vh - var(--top-offset));
  min-height: calc(100dvh - var(--top-offset));
  /* clip 横向越界但不创建滚动容器，确保项目 tab 能相对视口 sticky */
  overflow: clip;
  background: var(--archive-bg);
}

/* Legacy footer markup must never reserve space beneath the archive panels. */
.archive-footer { display: none !important; }

.archive-tabular { font-variant-numeric: tabular-nums; }

.archive-hero {
  position: relative;
  width: 100%;
  height: 64.5vh;
  min-height: 480px;
  overflow: hidden;
  border-bottom: 1px solid var(--archive-ink);
  background-color: var(--archive-bg);
  background-image:
    linear-gradient(var(--archive-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--archive-grid) 1px, transparent 1px),
    linear-gradient(var(--archive-grid-strong) 1px, transparent 1px),
    linear-gradient(90deg, var(--archive-grid-strong) 1px, transparent 1px);
  background-size:
    var(--archive-grid-unit) var(--archive-grid-unit),
    var(--archive-grid-unit) var(--archive-grid-unit),
    var(--archive-grid-major) var(--archive-grid-major),
    var(--archive-grid-major) var(--archive-grid-major);
  transition:
    height var(--archive-motion-duration) var(--archive-motion-ease),
    min-height var(--archive-motion-duration) var(--archive-motion-ease);
  will-change: height, min-height;
}
.frame--archive.has-open-project .archive-hero {
  height: 0;
  min-height: 0;
  border-bottom-color: transparent;
  pointer-events: none;
}
.archive-diagonal {
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  pointer-events: none;
  background-image: repeating-linear-gradient(45deg, transparent, transparent 199px, var(--archive-diagonal) 200px);
}
.archive-ruler {
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  width: 100%;
  height: 20px;
  border-bottom: 1px solid rgba(18, 20, 21, .44);
  background: var(--archive-bg);
}
.archive-ruler-tick {
  flex: 0 0 var(--archive-ruler-step);
  padding: 4px;
  border-left: 1px solid rgba(18, 20, 21, .32);
  color: var(--archive-muted);
  font-size: 8px;
}
.archive-title {
  position: absolute;
  right: auto;
  bottom: 20px;
  left: 20px;
  margin: 0;
  pointer-events: none;
  font-family: var(--font-serif);
  color: #17191A;
  font-size: clamp(72px, 11.25vw, 198px);
  font-weight: 400;
  letter-spacing: -0.045em;
  line-height: 0.85;
  text-transform: none;
}
.archive-hero-tools {
  position: absolute;
  right: 20px;
  bottom: 20px;
  z-index: 12;
  max-width: calc(100% - 40px);
  padding: 4px;
  background: var(--archive-bg);
  pointer-events: auto;
}

.archive-index-section {
  display: grid;
  flex: 1 0 auto;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 0fr);
  align-items: stretch;
  width: 100%;
  overflow: visible;
  transition: grid-template-columns var(--archive-motion-duration) var(--archive-motion-ease);
  will-change: grid-template-columns;
}
.archive-sidebar {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-content: start;
  column-gap: 20px;
  row-gap: 24px;
  min-width: 0;
  padding: 20px;
  overflow: hidden;
  border-right: 1px solid rgba(18, 20, 21, .28);
  background: var(--archive-zone-profile);
  color: #252525;
  scroll-margin-top: calc(var(--top-offset) + 16px);
  opacity: 1;
  transform: translateX(0) scaleX(1);
  transform-origin: right center;
  transition:
    transform var(--archive-motion-duration) var(--archive-motion-ease),
    padding var(--archive-motion-duration) var(--archive-motion-ease),
    opacity 420ms ease,
    border-color 220ms linear,
    visibility 0s linear;
  will-change: transform, opacity;
}
.archive-index-section.has-open-project {
  grid-template-columns: minmax(0, 0fr) minmax(0, .56fr) minmax(0, 2.44fr);
  min-height: 100vh;
}
.archive-index-section.has-open-project .archive-sidebar {
  padding-right: 0;
  padding-left: 0;
  border-right-color: transparent;
  opacity: 0;
  transform: translateX(-34%) scaleX(.88);
  visibility: hidden;
  pointer-events: none;
  transition-delay: 0s, 0s, 80ms, 0s, var(--archive-motion-duration);
}
.archive-profile__heading,
.archive-profile__section-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin: 0;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--archive-ink);
  font-family: var(--font-sans);
  color: var(--archive-accent);
}
.archive-region-title,
.archive-profile__section-title,
.archive-profile__meta dt,
.archive-detail__clip > .frame--work .work__meta dt {
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  letter-spacing: var(--archive-tracking-label);
  line-height: 1.2;
  text-transform: uppercase;
}
.archive-region-title {
  font-size: var(--archive-type-region-profile);
  font-weight: 700;
  letter-spacing: var(--archive-tracking-region);
}
.archive-region-title--projects { font-size: var(--archive-type-region-project); }
.archive-region-meta {
  color: var(--archive-accent);
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  font-size: var(--archive-type-support);
  font-weight: 500;
  letter-spacing: var(--archive-tracking-support);
  line-height: 1.2;
  text-transform: uppercase;
  white-space: nowrap;
}
.archive-profile__section-title {
  font-size: var(--archive-type-label);
}
.archive-profile__heading,
.archive-profile__intro,
.archive-profile__meta,
.archive-apparatus { grid-column: 1 / -1; }
.archive-profile__intro {
  display: grid;
  gap: 10px;
}
.archive-profile__role {
  margin: 0;
  font-family: var(--font-sans);
  font-size: var(--archive-type-primary);
  font-weight: 600;
  letter-spacing: .01em;
  line-height: 1.35;
  text-transform: none;
}
.archive-mission {
  max-width: 44ch;
  margin: 0;
  font-size: var(--archive-type-body);
  font-weight: 400;
  letter-spacing: .005em;
  line-height: 1.55;
  text-transform: none;
}
.archive-profile__meta {
  margin: 0;
  border-top: 1px solid var(--archive-ink);
}
.archive-profile__meta > div {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr);
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--archive-ink);
}
.archive-profile__meta dt,
.archive-profile__meta dd {
  min-width: 0;
  margin: 0;
  line-height: 1.4;
}
.archive-profile__meta dt {
  color: var(--archive-accent);
  font-size: var(--archive-type-label);
}
.archive-profile__meta dd {
  color: var(--archive-ink);
  font-size: var(--archive-type-ui);
  font-weight: 500;
  letter-spacing: .01em;
  text-transform: none;
}
.archive-profile__meta a {
  color: inherit;
  overflow-wrap: anywhere;
  text-decoration: none;
  border-bottom: 1px solid var(--archive-ink);
}
.archive-profile__group ul,
.archive-apparatus ul {
  margin: 8px 0 0;
  padding: 0;
  list-style: none;
}
.archive-apparatus ul {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 20px;
}
.archive-profile__group li,
.archive-apparatus li {
  padding: 8px 0;
  border-bottom: 1px solid var(--archive-grid-strong);
  line-height: 1.4;
  text-transform: none;
}
.archive-profile__item-primary {
  display: block;
  color: var(--archive-ink);
  font-size: var(--archive-type-ui);
  font-weight: 600;
  letter-spacing: .01em;
  line-height: 1.35;
}
.archive-profile__item-secondary {
  display: block;
  margin-top: 3px;
  color: var(--archive-muted);
  font-size: var(--archive-type-support);
  font-weight: 400;
  letter-spacing: .02em;
  line-height: 1.35;
}
.archive-apparatus { margin-top: 0; }
.archive-apparatus-title {
  display: flex;
}
.archive-index-list {
  position: relative;
  z-index: 1;
  min-width: 0;
  width: 100%;
  border: 0;
  background: var(--archive-zone-index);
  box-shadow: none;
  transition: background-color 240ms linear;
}
.archive-index-header {
  --archive-header-pad-x: clamp(20px, 1.041667vw, 40px);
  position: relative;
  z-index: 4;
  background: var(--archive-zone-index);
}
.archive-index-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: var(--archive-directory-meta-height);
  margin-left: 0;
  padding: 0 var(--archive-header-pad-x);
  border-bottom: 1px solid rgba(18, 20, 21, .75);
  background: var(--archive-zone-index);
  color: var(--archive-accent);
}
.archive-index-section.has-open-project .archive-index-list {
  position: sticky;
  top: var(--top-offset);
  z-index: 70;
  align-self: start;
  height: 100vh;
  height: 100dvh;
  max-height: 100vh;
  max-height: 100dvh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--archive-muted) transparent;
}
.archive-workspace {
  min-width: 0;
  overflow: clip;
  background: var(--archive-bg);
  opacity: 0;
  transform: translateX(8%);
  visibility: hidden;
  transition:
    opacity 420ms ease,
    transform var(--archive-motion-duration) var(--archive-motion-ease),
    visibility 0s linear var(--archive-motion-duration);
  will-change: transform, opacity;
}
.archive-index-section.has-open-project .archive-workspace {
  min-height: 100vh;
  opacity: 1;
  transform: translateX(0);
  visibility: visible;
  transition-delay: 100ms, 0s, 0s;
}
.archive-project { scroll-margin-top: var(--top-offset); }
/* 筛选重排时的掀页态：只用 transform，底色沿用列表自己的 zone 色，不引入新颜色 */
.archive-project.is-flipping {
  position: relative;
  z-index: 60;
  transform-origin: 50% 100%;
  backface-visibility: hidden;
  background: var(--archive-zone-index);
  will-change: transform;
}
/* 往上飞的压在往下沉的之上，两边才看得出是在绕过彼此换位 */
.archive-project.is-flipping--lift { z-index: 62; }
/* 掀页过程中行自身的过渡会和 FLIP 抢 transform，暂时关掉 */
.archive-project.is-flipping > button.archive-row { transition: none; }
.archive-row {
  --archive-row-pad-x: 20px;
  --archive-row-pad-y: 12px;
  display: grid;
  grid-template-columns: 80px minmax(0, 1fr) minmax(250px, 20vw);
  align-items: center;
  width: 100%;
  min-height: var(--archive-row-height);
  padding: var(--archive-row-pad-y) var(--archive-row-pad-x);
  border: 0;
  border-bottom: 1px solid rgba(18, 20, 21, .45);
  border-radius: 0;
  appearance: none;
  background: transparent;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  text-align: left;
  text-transform: inherit;
  transition:
    grid-template-columns var(--archive-motion-duration) var(--archive-motion-ease),
    padding var(--archive-motion-duration) var(--archive-motion-ease),
    background-color .2s ease,
    color .2s ease,
    box-shadow .14s ease,
    opacity .2s ease;
}
.archive-index-count {
  margin-left: 0;
}
.archive-index-meta .archive-index-count {
  color: var(--archive-accent);
  opacity: .9;
}
.archive-row--empty { color: var(--mute); }
.archive-row > .archive-tabular {
  font-size: var(--archive-type-support);
  font-weight: 500;
  letter-spacing: var(--archive-tracking-support);
}
button.archive-row {
  position: relative;
  background: var(--archive-zone-index);
}
button.archive-row::after {
  content: '[+]';
  position: absolute;
  right: 10px;
  color: var(--project-track-color, var(--archive-muted));
  font-size: var(--archive-type-support);
  letter-spacing: 0;
}
.archive-row__category {
  display: flex;
  flex-wrap: nowrap;
  align-items: baseline;
  padding-right: 34px;
  font-size: var(--archive-type-support);
  font-weight: 600;
  letter-spacing: var(--archive-tracking-support);
  text-transform: uppercase;
  white-space: nowrap;
  opacity: 1;
  overflow: hidden;
  transition:
    opacity 180ms ease,
    padding var(--archive-motion-duration) var(--archive-motion-ease),
    visibility 0s linear;
}
.archive-index-section.has-open-project .archive-row {
  --archive-row-pad-x: 16px;
  grid-template-columns: 48px minmax(0, 1fr) 0;
}
.archive-index-section.has-open-project .archive-index-header {
  --archive-header-pad-x: clamp(16px, .833333vw, 32px);
}
.archive-index-section.has-open-project .archive-index-meta {
  width: 100%;
  margin-left: 0;
  padding-left: var(--archive-header-pad-x);
}
.archive-index-section.has-open-project .archive-row__category {
  padding-right: 0;
  opacity: 0;
  visibility: hidden;
  transition-delay: 0s, 0s, 180ms;
}
.archive-index-section.has-open-project .archive-row__title {
  overflow: hidden;
  padding-right: 24px;
  font-size: var(--archive-type-body);
  text-overflow: ellipsis;
  white-space: nowrap;
}
.archive-row__track-label {
  color: var(--track-color, var(--archive-muted));
  white-space: nowrap;
}
.archive-row__track-label + .archive-row__track-label::before {
  content: '/';
  margin: 0 5px;
  color: var(--archive-muted);
}
.archive-project.is-track-match:not(.is-open) > button.archive-row {
  background: color-mix(in srgb, var(--active-track-color) 18%, var(--archive-bg));
}
.archive-project.is-track-match:not(.is-open) > button.archive-row .archive-row__title {
  color: var(--active-track-color);
  font-weight: 700;
}
.archive-project.is-track-dimmed:not(.is-open) > button.archive-row { opacity: .34; }
.archive-project.is-track-match:not(.is-open) > button.archive-row:hover,
.archive-project.is-track-match:not(.is-open) > button.archive-row:focus-visible {
  background: var(--archive-project-hover);
  color: var(--archive-ink);
  box-shadow: inset 3px 0 0 var(--project-track-color, var(--archive-muted));
}
.archive-project.is-track-match:not(.is-open) > button.archive-row:hover .archive-row__title,
.archive-project.is-track-match:not(.is-open) > button.archive-row:focus-visible .archive-row__title {
  color: inherit;
}
.archive-project.is-track-dimmed:not(.is-open) > button.archive-row:hover,
.archive-project.is-track-dimmed:not(.is-open) > button.archive-row:focus-visible { opacity: 1; }
button.archive-row:hover,
button.archive-row:focus-visible {
  background: var(--archive-project-hover);
  color: var(--archive-ink);
  box-shadow: inset 3px 0 0 var(--project-track-color, var(--archive-muted));
}
.archive-project.is-open > button.archive-row {
  position: sticky;
  top: var(--top-offset);
  z-index: 80;
  background: var(--archive-project-hover);
  color: var(--archive-ink);
  box-shadow: inset 3px 0 0 var(--project-track-color, var(--archive-muted));
}
.archive-project.is-open > button.archive-row .archive-row__track-label,
.archive-project.is-open > button.archive-row .archive-row__track-label::before,
button.archive-row:hover .archive-row__track-label,
button.archive-row:hover .archive-row__track-label::before,
button.archive-row:focus-visible .archive-row__track-label,
button.archive-row:focus-visible .archive-row__track-label::before { color: inherit; }
button.archive-row:hover::after,
button.archive-row:focus-visible::after,
.archive-project.is-open > button.archive-row::after { color: inherit; }
button.archive-row:focus-visible { outline: 1px solid var(--archive-ink); outline-offset: -3px; }
.archive-project.is-open > button.archive-row::after { content: '[-]'; }
.archive-row__title {
  font-size: var(--archive-type-region-project);
  font-weight: 600;
  letter-spacing: .01em;
  line-height: 1.3;
  text-transform: none;
}

.archive-detail {
  position: relative;
  z-index: 3;
  display: grid;
  grid-template-rows: 0fr;
  width: 100%;
  margin-left: 0;
  background: var(--archive-bg);
  transition:
    grid-template-rows 660ms var(--archive-motion-ease);
  will-change: grid-template-rows;
}
.archive-detail.is-open {
  grid-template-rows: 1fr;
  border-bottom: 1px solid var(--archive-ink);
  transition-delay: 80ms;
}
.archive-detail__clip {
  min-height: 0;
  overflow: hidden;
  opacity: 0;
  transform: translateY(-28px) scaleY(.985);
  transform-origin: top center;
  transition:
    opacity 360ms ease,
    transform 620ms var(--archive-motion-ease);
  will-change: transform, opacity;
}
.archive-detail.is-open .archive-detail__clip {
  opacity: 1;
  transform: translateY(0) scaleY(1);
  transition-delay: 180ms, 90ms;
}
.archive-detail__clip > .frame--work {
  --hero-media-box-height: clamp(420px, 62vh, 720px);
  --paper: var(--archive-bg);
  --surface: var(--archive-surface);
  --ink: var(--archive-ink);
  --rule: var(--archive-muted);
  --mute: var(--archive-muted);
  --quiet: var(--archive-quiet);
  --accent: var(--archive-accent);
  width: 100%;
  height: auto;
  min-height: 100vh;
  padding: clamp(28px, 3.2vw, 64px);
  padding-top: var(--archive-directory-offset);
  border-bottom: 0;
  background-color: var(--archive-bg);
  background-image:
    linear-gradient(var(--archive-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--archive-grid) 1px, transparent 1px),
    linear-gradient(var(--archive-grid-strong) 1px, transparent 1px),
    linear-gradient(90deg, var(--archive-grid-strong) 1px, transparent 1px);
  background-size:
    var(--archive-grid-unit) var(--archive-grid-unit),
    var(--archive-grid-unit) var(--archive-grid-unit),
    var(--archive-grid-major) var(--archive-grid-major),
    var(--archive-grid-major) var(--archive-grid-major);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  font-weight: 400;
  letter-spacing: .005em;
  line-height: 1.55;
  text-transform: none;
}
.archive-detail__clip > .frame--work,
.archive-detail__clip > .frame--work * { cursor: auto; }
.archive-detail__clip > .frame--work a,
.archive-detail__clip > .frame--work [role="button"] { cursor: pointer; }
.archive-detail__clip > .frame--work .frame__inner {
  grid-template-columns: minmax(300px, .82fr) minmax(0, 1.68fr);
  grid-template-rows: auto auto auto;
  column-gap: 20px;
  min-height: clamp(620px, 70vh, 860px);
}
.archive-detail__clip > .frame--work .work__text {
  padding: 20px;
  border: 1px solid var(--archive-ink);
  background: var(--archive-surface);
}
.archive-detail__clip > .frame--work .work__index {
  margin-bottom: 22px;
  padding: 8px 0 10px;
  border-top: 1px solid var(--archive-ink);
  border-bottom: 1px solid var(--archive-ink);
  color: var(--archive-accent);
  font-size: var(--archive-type-ui);
  font-weight: 500;
  letter-spacing: var(--archive-tracking-label);
}
.archive-detail__clip > .frame--work .work__track {
  color: var(--project-track-color, var(--archive-accent));
}
.archive-detail__clip > .frame--work .work__title {
  color: var(--archive-ink);
  font-family: var(--font-serif);
  font-size: clamp(38px, 3.7vw, 72px);
  font-weight: 400;
  letter-spacing: -.045em;
  line-height: .95;
}
.archive-detail__clip > .frame--work .work__subtitle {
  margin-top: 18px;
  color: var(--archive-muted);
  font-size: var(--archive-type-body);
  font-weight: 600;
  letter-spacing: var(--archive-tracking-support);
  line-height: 1.35;
  text-transform: uppercase;
}
.archive-detail__clip > .frame--work .work__meta {
  margin-top: 28px;
  border-top: 1px solid var(--archive-ink);
}
.archive-detail__clip > .frame--work .work__meta dl { grid-template-columns: 76px minmax(0, 1fr); }
.archive-detail__clip > .frame--work .work__meta dt,
.archive-detail__clip > .frame--work .work__meta dd {
  padding: 9px 0;
  border-bottom: 1px solid var(--archive-ink);
  font-size: var(--archive-type-ui);
  line-height: 1.35;
}
.archive-detail__clip > .frame--work .work__meta dt {
  padding-top: 10px;
  color: var(--archive-accent);
  font-size: var(--archive-type-label);
}
.archive-detail__clip > .frame--work .work__meta dd { color: var(--archive-ink); }
.archive-detail__clip > .frame--work .work__body {
  max-width: 52ch;
  margin-top: 24px;
  color: var(--archive-ink);
  font-size: var(--archive-type-body);
  line-height: 1.55;
}
.archive-detail__clip > .frame--work .work__link {
  margin-top: 22px;
  padding: 8px 10px;
  border: 1px solid var(--archive-accent);
  color: var(--archive-accent);
  font-size: var(--archive-type-support);
  font-weight: 600;
  letter-spacing: var(--archive-tracking-support);
  text-transform: uppercase;
  text-decoration: none;
}
.archive-detail__clip > .frame--work .work__link--repo {
  border-color: var(--archive-muted);
  color: var(--archive-muted);
  font-variant-numeric: tabular-nums;
  text-transform: none;
  letter-spacing: .02em;
}
.archive-detail__clip > .frame--work .work__link--repo:hover,
.archive-detail__clip > .frame--work .work__link--repo:focus-visible {
  border-color: var(--archive-ink);
  background: var(--archive-ink);
  color: var(--archive-surface);
}
.archive-detail__clip > .frame--work .work__link:hover,
.archive-detail__clip > .frame--work .work__link:focus-visible {
  background: var(--archive-accent);
  color: var(--archive-surface);
  outline: 0;
}
.archive-detail__clip > .frame--work .work__figure {
  align-self: start;
  justify-content: center;
  width: 100%;
  height: var(--hero-media-box-height);
  min-height: 0;
  padding: 12px;
  border: 1px solid var(--archive-ink);
  background: var(--archive-zone-profile);
  contain: layout paint;
}
.archive-detail__clip > .frame--work .work__figure :is(img, video) {
  width: auto;
  height: auto;
  max-width: 92%;
  max-height: 86%;
  object-position: center;
}
.archive-detail__clip > .frame--work .work__figcaption {
  margin-top: 0;
  padding: 9px 12px;
  border-right: 1px solid var(--archive-ink);
  border-bottom: 1px solid var(--archive-ink);
  border-left: 1px solid var(--archive-ink);
  background: var(--archive-zone-profile);
  color: var(--archive-muted);
  font-size: var(--archive-type-support);
  letter-spacing: .04em;
}
.archive-detail__clip > .frame--work .work__thumbs {
  margin-top: 12px;
  padding: 0;
  border: 0;
  background: var(--archive-bg);
}
.archive-detail__clip > .frame--work .work__thumbs > div {
  padding: 0;
  border: 0;
  background: transparent;
  opacity: .84;
}
.archive-detail__clip > .frame--work .work__thumbs > div:hover,
.archive-detail__clip > .frame--work .work__thumbs > div:focus-visible {
  opacity: 1;
  outline: 0;
}
.archive-tracker {
  position: fixed;
  top: var(--tracker-y);
  left: var(--tracker-x);
  z-index: 9999;
  --tracker-x: 0px;
  --tracker-y: 0px;
  width: 48px;
  height: 48px;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -50%);
  mix-blend-mode: multiply;
  transition: opacity .12s linear;
}
.frame--archive:has(.archive-hero:hover) .archive-tracker { opacity: 1; }
.frame--archive:has(.frame--work:hover) .archive-tracker,
.frame--archive:has(.archive-hero-tools:hover) .archive-tracker { opacity: 0; }
.archive-tracker::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 8px;
  height: 8px;
  border: 1px solid var(--archive-ink);
  transform: translate(-50%, -50%);
}
.archive-tracker__cross {
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  height: 1px;
  transform: translateY(-50%);
  background: linear-gradient(
    to right,
    var(--archive-ink) 0 calc(50% - 6px),
    transparent calc(50% - 6px) calc(50% + 6px),
    var(--archive-ink) calc(50% + 6px) 100%
  );
}
.archive-tracker__cross--vertical {
  top: 0;
  left: 50%;
  width: 1px;
  height: 100%;
  transform: translateX(-50%);
  background: linear-gradient(
    to bottom,
    var(--archive-ink) 0 calc(50% - 6px),
    transparent calc(50% - 6px) calc(50% + 6px),
    var(--archive-ink) calc(50% + 6px) 100%
  );
}

/* ==========================================================
   CAD 视口构件：状态栏 / 网格捕捉 / 框选
   状态栏对应 Rhino 底部状态条：左侧坐标读数，右侧都是真开关
   ========================================================== */
.archive-statusbar {
  position: sticky;
  bottom: 0;
  z-index: 90;
  display: flex;
  align-items: stretch;
  margin-top: auto;
  border-top: 1px solid rgba(18, 20, 21, .44);
  background: var(--archive-bg);
  color: var(--archive-muted);
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  font-size: var(--archive-type-label);
  font-weight: 500;
  letter-spacing: var(--archive-tracking-label);
  line-height: 1;
  text-transform: uppercase;
  user-select: none;
}
.archive-statusbar__cell {
  display: flex;
  align-items: center;
  padding: 7px 12px;
  border-left: 1px solid rgba(18, 20, 21, .18);
}
.archive-statusbar__cell:first-child { border-left: 0; }
.archive-statusbar__flex { flex: 1; }
/* 坐标读数定宽，数字跳动时不挤动右侧开关 */
.archive-statusbar__coords { min-width: 19ch; }
.archive-statusbar__toggle {
  display: flex;
  align-items: center;
  padding: 7px 12px;
  border: 0;
  border-left: 1px solid rgba(18, 20, 21, .18);
  border-radius: 0;
  appearance: none;
  background: transparent;
  color: var(--archive-quiet);
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  cursor: pointer;
}
.archive-statusbar__toggle:hover { color: var(--archive-muted); }
.archive-statusbar__toggle.is-on { color: var(--archive-ink); font-weight: 700; }
.archive-statusbar__toggle:focus-visible { outline: 1px solid var(--archive-ink); outline-offset: -3px; }
/* 状态栏是常规控件，准星让位给系统光标 */
.frame--archive:has(.archive-statusbar:hover) .archive-tracker { opacity: 0; }

/* GRID 开关：关掉切割垫与作品页的底网格，结构线保留 */
.frame--archive.grid-off .archive-hero,
.frame--archive.grid-off .archive-detail__clip > .frame--work { background-image: none; }

/* SNAP 吸附到网格交点时，准星中心方块实心点亮 */
.archive-tracker.is-snapped::after {
  width: 7px;
  height: 7px;
  background: var(--archive-ink);
}

/* CAD 式绘制：hero 上的画纸层。
   不设 z-index——按 DOM 顺序画在大名字之下，墨迹从名字背后经过。
   整层 82% 强度做“大气透视”：网格最远最淡 → 画纸层退一步 → 名字全浓度最近，
   灰度差即图层高差 */
.archive-sketch {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: .82;
  pointer-events: none;
}
/* 绘制中的实时读数：段长 / 角度 / 点数 */
.archive-statusbar__cell--draw { color: var(--info); }

/* 光标旁上下文菜单（Blender 的结构、Rams 的皮肤）；fixed 定位不受 hero 裁剪 */
.archive-ctx {
  position: fixed;
  z-index: 96;
  display: none;
  flex-direction: column;
  min-width: 148px;
  padding: 4px 0;
  border: 1px solid var(--archive-quiet);
  background: var(--archive-bg);
  cursor: auto;
  user-select: none;
}
.archive-ctx .head {
  padding: 5px 14px 6px;
  color: var(--archive-muted);
  font-family: var(--font-sans);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.archive-ctx .sep {
  height: 1px;
  margin: 4px 0;
  background: rgba(18, 20, 21, .12);
}
.archive-ctx button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  border: 0;
  border-radius: 0;
  appearance: none;
  padding: 6px 14px;
  background: transparent;
  color: var(--archive-ink);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .02em;
  text-align: left;
  text-transform: none;
  cursor: pointer;
}
.archive-ctx button:hover { background: rgba(18, 20, 21, .06); }
.archive-ctx button.on { box-shadow: inset 2px 0 0 var(--archive-ink); font-weight: 600; }
.archive-ctx button.bool { color: var(--archive-accent); }
.archive-ctx button .key {
  color: var(--archive-quiet);
  font-size: 9px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

/* hero 内的形状框选矩形：与项目行框选同一套语言 */
.archive-shape-marquee {
  position: absolute;
  z-index: 7;
  display: none;
  pointer-events: none;
  border: 1px solid var(--info);
  background: rgba(64, 90, 101, .14);
}
.archive-shape-marquee.is-crossing {
  border-style: dashed;
  border-color: var(--signal);
  background: rgba(61, 92, 73, .14);
}

/* 行悬停预览：在行下方展开成抽屉，把后续行挤开而不是遮挡；
   展开动画与项目详情同款（grid rows 0fr→1fr），图片硬切换轮播 */
.archive-peek {
  display: grid;
  grid-template-rows: 0fr;
  pointer-events: none;
  transition: grid-template-rows 260ms var(--archive-motion-ease);
}
.archive-peek.is-open { grid-template-rows: 1fr; }
.archive-peek__clip {
  min-height: 0;
  overflow: hidden;
}
.archive-peek__body {
  padding: 12px 20px 14px;
  border-bottom: 1px solid rgba(18, 20, 21, .45);
  background: var(--archive-zone-index);
}
/* 胶片长条：等高图带匀速左移，无缝循环 */
.archive-peek__strip {
  height: clamp(150px, 16vw, 240px);
  overflow: hidden;
  border: 1px solid var(--archive-ink);
  background: var(--archive-zone-profile);
}
.archive-peek__reel {
  display: flex;
  gap: 10px;
  height: 100%;
  width: max-content;
  will-change: transform;
}
.archive-peek__reel.is-single {
  width: 100%;
  justify-content: center;
}
.archive-peek__reel img {
  display: block;
  height: 100%;
  width: auto;
}
.archive-peek__caption {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 8px;
  color: var(--archive-muted);
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  font-size: var(--archive-type-support);
  font-weight: 600;
  letter-spacing: var(--archive-tracking-support);
  text-transform: uppercase;
  white-space: nowrap;
}
.archive-peek__caption .t {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 框选矩形：左→右实线窗选用技术蓝灰，右→左虚线叉选用制造绿
   两种 rgba 底色即 --info / --signal 的低透明度形态，不引入新颜色 */
.archive-marquee {
  position: fixed;
  z-index: 95;
  display: none;
  pointer-events: none;
  border: 1px solid var(--info);
  background: rgba(64, 90, 101, .18);
}
.archive-marquee.is-crossing {
  border-style: dashed;
  border-color: var(--signal);
  background: rgba(61, 92, 73, .18);
}
/* 框角上的模式标签：窗选/叉选 + 实时命中数，教会不懂的人，逗笑懂的人 */
.archive-marquee::after {
  content: attr(data-marquee-label);
  position: absolute;
  right: 6px;
  bottom: 4px;
  color: var(--info);
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  font-size: var(--archive-type-label);
  font-weight: 700;
  letter-spacing: var(--archive-tracking-label);
  text-transform: uppercase;
  white-space: nowrap;
}
.archive-marquee.is-crossing::after { color: var(--signal); }
/* 拖框期间整个切割垫都禁掉文字选择，原生蓝选不再出现 */
.frame--archive.is-marquee-dragging,
.frame--archive.is-marquee-dragging * { user-select: none; }
.archive-project.is-marquee-selected:not(.is-open) > button.archive-row {
  background: color-mix(in srgb, var(--info) 24%, var(--archive-zone-index));
  box-shadow: inset 3px 0 0 var(--info);
}

@media (max-width: 900px) {
  .frame--archive { padding-right: 0; padding-left: 0; }
  .archive-hero { min-height: 450px; height: 57vh; }
  .archive-title { bottom: 82px; font-size: 72px; }
  .archive-hero-tools { right: 14px; bottom: 14px; left: 14px; max-width: none; }
  .archive-index-meta {
    width: 100%;
    margin-left: 0;
    padding-left: var(--archive-header-pad-x);
  }
  .archive-index-section,
  .archive-index-section.has-open-project { grid-template-columns: minmax(0, 1fr); }
  .archive-sidebar { border-right: 0; border-bottom: 1px solid var(--archive-ink); }
  .archive-index-section.has-open-project .archive-sidebar { display: none; }

@media (hover: none), (pointer: coarse) {

  .archive-row {

    --archive-row-pad-y: calc(var(--u) * 1.5);

  }
  .archive-row__title { font-size: var(--archive-type-region-project); }
  .archive-index-count,
  button.archive-row::after { font-size: var(--archive-type-support); }
  .archive-index-count { margin-left: calc(var(--u) * 1.5); }
  button.archive-row::after { right: calc(var(--u) * 1.25); }
  .archive-row__category { padding-right: calc(var(--u) * 4.25); }
  .archive-index-section.has-open-project .archive-row {

  }
  .archive-detail__clip > .frame--work {
    --hero-media-box-height: clamp(720px, 62vh, 1440px);
    padding: clamp(64px, 3.333333vw, 128px);
    padding-top: var(--archive-directory-offset);
  }
  .archive-detail__clip > .frame--work .frame__inner {

  }
  .archive-detail__clip > .frame--work .work__text { padding: calc(var(--u) * 2.5); }
  .archive-detail__clip > .frame--work .work__index {

  .archive-detail__clip > .frame--work .work__title {

  .archive-detail__clip > .frame--work .work__subtitle {

  .archive-detail__clip > .frame--work .work__meta dt,
  .archive-detail__clip > .frame--work .work__meta dd {

  .archive-detail__clip > .frame--work .work__meta dt {

  }
  .archive-detail__clip > .frame--work .work__body {

  }
  .archive-detail__clip > .frame--work .work__link {
    margin-top: calc(var(--u) * 2.75);
    padding: var(--u) calc(var(--u) * 1.25);

  }
  .archive-detail__clip > .frame--work .work__figure { padding: calc(var(--u) * 1.5); }
  .archive-detail__clip > .frame--work .work__figcaption {
    padding: calc(var(--u) * 1.125) calc(var(--u) * 1.5);
    font-size: var(--archive-type-support);
  }
  .archive-detail__clip > .frame--work .work__thumbs { margin-top: calc(var(--u) * 1.5); }

@media (max-width: 680px) {
  .archive-sidebar { grid-template-columns: minmax(0, 1fr); }
  .archive-profile__group { grid-column: 1; }
  .archive-apparatus ul { grid-template-columns: minmax(0, 1fr); }
  .archive-row {
    --archive-row-pad-x: 12px;
    --archive-row-pad-y: 12px;
    grid-template-columns: 48px minmax(0, 1fr) 170px;
  }
  .archive-index-section.has-open-project .archive-row { --archive-row-pad-x: 12px; }
  button.archive-row::after { right: 6px; }
  .archive-row__category {
    padding-right: 22px;
    font-size: 8px;
    letter-spacing: .02em;
  }
  .archive-row__track-label + .archive-row__track-label::before { margin-inline: 3px; }
  .archive-row__title { font-size: 12px; }

  .archive-detail__clip > .frame--work .frame__inner { min-height: 0; }

@media (prefers-reduced-motion: reduce) {
  .archive-index-section,
  .archive-hero,
  .archive-sidebar,
  .archive-workspace,
  .archive-detail,
  .archive-detail__clip,
  .archive-row,
  .archive-peek,
  .archive-tracker { transition: none; }
  [data-zoomable] :is(img, video) { transition: none; }
  .is-loading::before,
  .is-loading::after { animation: none; }
  .lightbox__frame { transition: none; }
  /* 关掉掀页飞行（JS 也会跳过动画，这里兜底压过 WAAPI） */
  .archive-project.is-flipping {
    transform: none !important;
    opacity: 1 !important;
  }
}
/* 底部滚动提示 */
.scroll-cue {
  position: absolute;
  bottom: calc(var(--u) * 4);
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-micro);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mute);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--u) * 1);
}
.scroll-cue::after {
  content: "";
  width: 1px; height: 24px;
  background: var(--rule);
}

/* ==========================================================
   MP-02  .frame--work —— 作品页（一个项目一页）
   左：编号 / 标题 / 元信息 / 简介   右：图片
   ========================================================== */

.frame--work .frame__inner {
  display: grid;
  grid-template-columns: minmax(0, 25vw) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto auto;
  min-height: 0;
  column-gap: calc(var(--u) * 8);
  row-gap: 0;
  align-items: stretch;
}

/* Desktop work frames stay viewport-sized even when a source image is very tall. */
@media (min-width: 901px) {
  .frame--work { height: 100vh; }
}

.work__text {
  grid-column: 1;
  grid-row: 1;
  min-width: 0;
  align-self: start;
}

.work__index {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: calc(var(--u) * 2);
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-caption);
  letter-spacing: 0.16em;
  color: var(--accent);
  padding-bottom: calc(var(--u) * 1.5);
  border-bottom: var(--hair);
  margin-bottom: calc(var(--u) * 3);
}
.work__track {
  overflow: hidden;
  color: var(--mute);
  letter-spacing: 0.1em;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.work__title {
  margin: 0;
  font-size: var(--fs-title);
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: -0.015em;
}
.work__subtitle {
  margin: calc(var(--u) * 1.5) 0 0;
  font-size: var(--fs-body);
  font-weight: 300;
  color: var(--mute);
}

/* 元信息：年份 / 类型 / 角色 —— 定宽标签列 */
.work__meta {
  margin: calc(var(--u) * 4) 0 0;
  border-top: var(--quiet-hair);
}
.work__meta dl {
  margin: 0;
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
  gap: 0;
}
.work__meta dt,
.work__meta dd {
  margin: 0;
  padding: calc(var(--u) * 1.25) 0;
  border-bottom: var(--quiet-hair);
  font-size: var(--fs-small);
}
.work__meta dt {
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-micro);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--mute);
  padding-top: calc(var(--u) * 1.5);
}

.work__body {
  margin: calc(var(--u) * 4) 0 0;
  font-size: var(--fs-body);
  line-height: 1.7;
  max-width: 46ch;
  color: var(--ink);
}

.work__links {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: calc(var(--u) * 1.5);
}
.work__link {
  display: inline-block;
  margin-top: calc(var(--u) * 3);
  font-family: var(--font-sans);
  font-size: var(--fs-caption);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--accent);
  padding-bottom: 2px;
}

/* 主图缩放：控件沿用档案行的方括号排版，不引入新颜色、字号、圆角与阴影 */
[data-zoomable] :is(img, video) {
  transform-origin: 50% 50%;
  transition: transform 180ms var(--archive-motion-ease);
}
/* 连续输入（拖拽、滚轮）期间关掉过渡：每来一个事件就重启一次 180ms
   插值，手感会变成橡皮筋。按钮和键盘那种离散步进才留过渡。 */
[data-zoomable].is-panning :is(img, video),
[data-zoomable].is-zooming :is(img, video) { transition: none; }
/* 放大态单独提升一层，transform 走合成而不是每帧重新光栅化 */
[data-zoomable].is-zoomed :is(img, video) { will-change: transform; }
[data-zoomable].is-zoomed { cursor: grab; }
[data-zoomable].is-zoomed.is-panning { cursor: grabbing; }
[data-zoomable].is-zoomed :is(img, video) { user-select: none; -webkit-user-drag: none; }
.hero-zoom {
  position: absolute;
  right: 12px;
  bottom: 12px;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--archive-quiet);
  background: var(--archive-bg);
  color: var(--archive-muted);
  font-size: var(--archive-type-support);
  letter-spacing: var(--archive-tracking-support);
}
.hero-zoom button {
  min-width: 38px;
  padding: 3px 4px;
  border: 0;
  border-radius: 0;
  appearance: none;
  background: transparent;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  font-variant-numeric: tabular-nums;
  text-align: center;
  cursor: pointer;
}
.hero-zoom button:hover:not(:disabled) { color: var(--archive-ink); }
.hero-zoom button:disabled { opacity: .35; cursor: default; }
.hero-zoom button:focus-visible { outline: 1px solid var(--archive-ink); outline-offset: -2px; }

/* 灯箱：全屏纸面而不是暗色遮罩，排版与配色沿用档案页 */
html.has-lightbox { overflow: hidden; }
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 9998;
  display: flex;
  flex-direction: column;
  background: var(--archive-bg);
  color: var(--archive-ink);
  font-family: var(--font-sans);
}
.lightbox[hidden] { display: none; }
/* 开合过渡裁的是这个矩形，窗口本身尺寸和内部排版全程不变 */
.lightbox { clip-path: inset(0px 0px 0px 0px); will-change: clip-path; }
.lightbox__bar {
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: var(--archive-directory-meta-height);
  padding: 0 clamp(16px, 1.041667vw, 32px);
  border-bottom: 1px solid var(--archive-ink);
  background: var(--archive-zone-index);
  font-size: var(--archive-type-support);
  letter-spacing: var(--archive-tracking-support);
  text-transform: uppercase;
}
.lightbox__title { color: var(--archive-accent); }
.lightbox__count {
  margin-left: auto;
  color: var(--archive-muted);
  font-variant-numeric: tabular-nums;
}
.lightbox__back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  padding: 6px 14px;
  border: 1px solid var(--archive-ink);
  border-radius: 0;
  appearance: none;
  background: transparent;
  color: var(--archive-ink);
  font: inherit;
  letter-spacing: inherit;
  cursor: pointer;
}
.lightbox__back:hover { background: var(--archive-project-hover); }
.lightbox__back:focus-visible { outline: 1px solid var(--archive-ink); outline-offset: 2px; }
/* 翻页键挂在灯箱上而不是舞台里：换图时清空舞台不会把它们带走，
   点它们也不会触发"点舞台空白处关闭" */
.lightbox__nav {
  position: absolute;
  top: 50%;
  z-index: 3;
  transform: translateY(-50%);
  min-width: 44px;
  min-height: 64px;
  padding: 0 10px;
  border: 1px solid var(--archive-quiet);
  border-radius: 0;
  appearance: none;
  background: var(--archive-bg);
  color: var(--archive-muted);
  font: inherit;
  letter-spacing: inherit;
  cursor: pointer;
}
.lightbox__nav--prev { left: 12px; }
.lightbox__nav--next { right: 12px; }
.lightbox__nav:hover { border-color: var(--archive-ink); color: var(--archive-ink); }
.lightbox__nav:focus-visible { outline: 1px solid var(--archive-ink); outline-offset: 2px; }
.lightbox__stage {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(16px, 1.6vw, 40px);
  overflow: hidden;
  background: var(--archive-zone-profile);
}
.lightbox__stage :is(img, video) { display: block; width: auto; height: auto; }
.lightbox__stage iframe { border: 0; background: var(--archive-bg); }
.lightbox__film {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 92px;
  padding: 10px clamp(16px, 1.041667vw, 32px);
  border-top: 1px solid var(--archive-ink);
  background: var(--archive-zone-index);
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--archive-muted) transparent;
}
.lightbox__frame {
  flex: 0 0 auto;
  width: 104px;
  height: 70px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 0;
  appearance: none;
  background: var(--archive-bg);
  overflow: hidden;
  opacity: .55;
  cursor: pointer;
  transition: opacity 160ms linear, border-color 160ms linear;
}
.lightbox__frame :is(img, video) {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.lightbox__frame iframe { border: 0; pointer-events: none; }
.lightbox__frame:hover { opacity: 1; }
.lightbox__frame[aria-current="true"] { opacity: 1; border-color: var(--archive-ink); }
.lightbox__frame:focus-visible { outline: 1px solid var(--archive-ink); outline-offset: 2px; }

/* PDF 卡片的封面图：铺满卡片，文字压在它上面 */
.media-pdf-card { position: relative; overflow: hidden; }
.media-pdf-card__poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
}
.media-pdf-card:has(.media-pdf-card__poster) .media-pdf-card__type,
.media-pdf-card:has(.media-pdf-card__poster) .media-pdf-card__name {
  position: relative;
  z-index: 1;
}
.media-pdf-card:has(.media-pdf-card__poster) .media-pdf-card__name {
  padding: 4px 6px;
  background: var(--archive-bg, #FAFAF8);
}
.media-pdf-card:has(.media-pdf-card__poster) .media-pdf-card__type {
  padding: 2px 6px;
  background: var(--archive-accent, #9A3330);
  color: var(--archive-surface, #FFFFFF);
}

/* 图片区：主图在右上；备选媒体按原始比例形成紧凑瀑布流 */
.work__media {
  display: contents;
}
.work__figure {
  position: relative;   /* 缩放控件的定位参照 */
  grid-column: 2;
  grid-row: 1;
  margin: 0;
  width: 100%;
  height: 100%;
  min-height: 0;
  border: 0;
  background: transparent;
  aspect-ratio: auto;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  overflow: hidden;
}
.work__figure :is(img, video) {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: left center;
}
/* 交互式 HTML 素材（人设表）用 iframe 承载。
   固定成设计尺寸后由 fitEmbedFrame() 整体缩放，避免被压成窄屏版式。 */
.work__figure > iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: transparent;
}
/* The desk needs room for its controls and the dimensioned model together. */
.archive-detail__clip > .frame--work[data-project-id="p18"] .work__figure {
  height: 680px;
  min-height: 680px;
  aspect-ratio: auto;
}
/* 缩略图格子里只做静态预览，点击仍交给格子本身处理 */
.work__thumbs > div > iframe {
  display: block;
  width: 1000px;
  height: 625px;
  transform-origin: 0 0;
  border: 0;
  pointer-events: none;
}
.work__figcaption {
  grid-column: 2;
  grid-row: 2;
  margin-top: calc(var(--u) * 1.5);
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-micro);
  letter-spacing: 0.12em;
  color: var(--mute);
}
.work__thumbs {
  --masonry-columns: 4;
  grid-column: 1 / -1;
  grid-row: 3;
  position: relative;
  margin-top: calc(var(--u) * 2);
  display: block;
  column-gap: clamp(8px, .625vw, 16px);
}
.work__thumbs > div {
  display: block;
  position: absolute;
  top: 0;
  left: 0;
  margin: 0;
  border: 0;
  background: transparent;
  overflow: hidden;
  cursor: pointer;
  transition: opacity 160ms linear;
}
.work__thumbs > div:hover { opacity: 0.82; }
.work__thumbs > div:focus-visible {
  outline: 0;
  opacity: .72;
}
.work__thumbs :is(img, video) {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}
.media-pdf-card {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  aspect-ratio: 16 / 10;
  padding: clamp(14px, 1.2vw, 24px);
  border: 1px solid var(--archive-quiet);
  background: var(--archive-bg);
  color: var(--archive-ink);
  font-family: var(--font-sans);
  text-align: left;
}
.media-pdf-card__type {
  color: var(--archive-accent);
  font-size: var(--archive-type-support);
  font-weight: 700;
  letter-spacing: var(--archive-tracking-label);
}
.media-pdf-card__name {
  display: -webkit-box;
  overflow: hidden;
  font-size: var(--archive-type-label);
  letter-spacing: .06em;
  line-height: 1.35;
  overflow-wrap: anywhere;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}
.lightbox__frame .media-pdf-card {
  height: 100%;
  aspect-ratio: auto;
  gap: 4px;
  padding: 7px;
}
.lightbox__frame .media-pdf-card__type { font-size: 9px; }
.lightbox__frame .media-pdf-card__name {
  font-size: 8px;
  -webkit-line-clamp: 2;
}

/* 占位块：正式图片接入后删掉 .is-empty 即可 */
.is-empty {
  position: relative;
}
/* 载入中：顶边一条扫描线 + 居中微标签。只用现有 token，不引入新颜色。 */
.is-loading { position: relative; }
.is-loading::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: var(--archive-muted, var(--mute));
  transform-origin: left center;
  animation: media-loading-sweep 1.4s ease-in-out infinite;
  pointer-events: none;
}
.is-loading::after {
  content: 'LOADING';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--archive-muted, var(--mute));
  font-family: var(--font-sans);
  font-size: var(--archive-type-label, var(--fs-micro));
  letter-spacing: var(--archive-tracking-label, .12em);
  animation: media-loading-pulse 1.1s ease-in-out infinite;
  pointer-events: none;
}
/* 缩略图格子太小，塞不下文字，只留扫描线 */
.work__thumbs > div.is-loading::after,
.lightbox__frame.is-loading::after { content: ''; }
@keyframes media-loading-sweep {
  0%   { transform: scaleX(0);   opacity: .15; }
  50%  { transform: scaleX(1);   opacity: .55; }
  100% { transform: scaleX(0) translateX(100%); opacity: .15; }
}
@keyframes media-loading-pulse {
  0%, 100% { opacity: .3; }
  50%      { opacity: .75; }
}
.is-empty::after {
  content: attr(data-ph);
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-sans);
  font-size: var(--fs-micro);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--quiet);
}

<script>
(function () {
  'use strict';

  var DATA  = window.PORTFOLIO_DATA || null;
  var main  = document.getElementById('frames');
  var filterHost = null;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 框选、捕捉、坐标读数只在鼠标环境启用；触屏由 CSS 一并隐藏状态栏
  var finePointer = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  // 筛选切换时要清空框选结果；真正的实现在 setupArchiveFrame 里赋值
  var clearArchiveSelection = function () {};
  // 打开项目时放弃 hero 上未完成的 CAD 绘制；同样在 setupArchiveFrame 里赋值
  var cancelArchiveSketch = function () {};

  // 没有 data.js 时直接显示提示页，不再继续渲染
  if (!DATA) {
    document.getElementById('nodata').hidden = false;
    return;
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  // 取 template 里带 data-f 标记的槽位
  function slot(node, name) { return node.querySelector('[data-f="' + name + '"]'); }

  // 填文字；内容为空则整个元素移除，避免留下空行影响版式
  function fill(node, name, text) {
    var el = slot(node, name);
    if (!el) return;
    if (text) { el.textContent = text; }
    else { el.parentNode.removeChild(el); }
  }

  function isVideoSource(src) {
    return /\.(mp4|webm|mov)(?:[?#].*)?$/i.test(src || '');
  }

  function isPdfSource(src) {
    return /\.pdf(?:[?#].*)?$/i.test(src || '');
  }

  function mediaFileName(src) {
    var clean = String(src || '').split(/[?#]/)[0];
    var name = clean.slice(clean.lastIndexOf('/') + 1);
    try { name = decodeURIComponent(name); } catch (error) {}
    return name.replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ');
  }

  // 交互式 HTML 素材，用 iframe 内嵌，保留其自身的交互
  function isEmbedSource(src) {
    return /\.html?(?:[?#].*)?$/i.test(src || '');
  }

  // 生成图片、视频、PDF 或内嵌页面；没有媒体就把容器标成占位块。
  function setMedia(box, src, alt, placeholder, options) {
    if (!box) return null;
    options = options || {};
    if (src) {
      if (isPdfSource(src)) {
        // 列表只显示轻量文档卡，避免展开项目时同时下载多份完整 PDF；
        // 灯箱里的主舞台才挂载浏览器原生 PDF 阅读器。
        if (!options.controls) {
          var pdfCard = document.createElement('span');
          pdfCard.className = 'media-pdf-card';
          var pdfType = document.createElement('strong');
          pdfType.className = 'media-pdf-card__type';
          pdfType.textContent = 'PDF';
          var pdfName = document.createElement('span');
          pdfName.className = 'media-pdf-card__name';
          pdfName.textContent = mediaFileName(src);
          // 封面图：约定 <同名>__poster.jpg，取不到就退回纯文字卡
          var poster = document.createElement('img');
          poster.className = 'media-pdf-card__poster';
          poster.alt = '';
          poster.loading = 'lazy';
          poster.decoding = 'async';
          poster.addEventListener('error', function () {
            if (poster.parentNode) poster.parentNode.removeChild(poster);
          }, { once: true });
          var posterSrc = src.replace(/\.pdf(\?.*)?$/i, '__poster.jpg');
          if (options.defer) poster.dataset.src = posterSrc;
          else poster.src = posterSrc;
          pdfCard.appendChild(poster);
          pdfCard.appendChild(pdfType);
          pdfCard.appendChild(pdfName);
          box.appendChild(pdfCard);
          return pdfCard;
        }
        var pdfFrame = document.createElement('iframe');
        pdfFrame.className = 'media-pdf-frame';
        var pdfSrc = src + (src.indexOf('#') === -1 ? '#' : '&')
          + 'page=1&view=FitH&toolbar=1&navpanes=0';
        if (options.defer) pdfFrame.dataset.src = pdfSrc;
        else { pdfFrame.src = pdfSrc; window.setTimeout(function () { trackMediaLoading(pdfFrame); }, 0); }
        pdfFrame.title = alt || mediaFileName(src);
        pdfFrame.loading = 'lazy';
        box.appendChild(pdfFrame);
        return pdfFrame;
      }
      if (isEmbedSource(src)) {
        var frame = document.createElement('iframe');
        // controls 为真表示挂在主图位：可滚动、可交互；
        // 缩略图位加 ?thumb 让内嵌页只渲染第一段，且不接收指针与滚动
        var frameSrc = options.controls ? src : (src + '?thumb=1');
        if (options.defer) frame.dataset.src = frameSrc;

      var media = stage.querySelector('img, video');
      if (media && event.target === media) {
        var state = heroZoomState(stage);
        var limit = heroZoomMax(stage);
        if (state.scale >= limit - 0.001) {
          resetHeroZoom(stage);         // already 到顶，再点回到贴合
          return;
        }
        var rect = stage.getBoundingClientRect();
        zoomHeroTo(stage, state.scale * 2,
                   event.clientX - rect.left - rect.width / 2,
                   event.clientY - rect.top - rect.height / 2);
        return;
      }

      // 点在图以外的空白处：放大态下留给拖拽，未放大就关闭
      if (heroZoomState(stage).scale > 1) return;
      dismissLightbox();
    });

    // 焦点困在灯箱内
    lightbox.addEventListener('keydown', function (event) {
      if (event.key !== 'Tab') return;
      var focusable = lightbox.querySelectorAll('button:not(:disabled)');
      if (!focusable.length) return;
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });

    setupHeroZoom(stage);
    return lightbox;
  }

  // 内嵌页铺满舞台。首帧时舞台可能还没有尺寸（量到 0 就会把 iframe 设成 1px），
  // 所以挂个 ResizeObserver，尺寸一变就重设。
  function fillStageWithEmbed(stage, media) {
    var apply = function () {
      if (!media.isConnected) return;
      var box = innerBox(stage);
      if (box[0] < 2 || box[1] < 2) return;
      media.style.width = Math.round(box[0]) + 'px';
      media.style.height = Math.round(box[1]) + 'px';
    };
    apply();
    if (window.ResizeObserver) {
      if (stage._embedObserver) stage._embedObserver.disconnect();
      stage._embedObserver = new window.ResizeObserver(apply);
      stage._embedObserver.observe(stage);
    }
  }

  function showLightboxItem(index) {
    var items = lightboxState.items;
    if (!lightbox || !items.length) return;
    lightboxState.index = (index + items.length) % items.length;

    var stage = lightboxStage();
    // 换张先把缩放状态归零，避免新图带着上一张的倍率入场
    var state = heroZoomState(stage);
    state.scale = 1;
    state.x = 0;
    state.y = 0;
    clearLightboxStage();

    var media = setMedia(stage, items[lightboxState.index], lightboxState.title, 'Media', {
      controls: true,
      autoplay: !reduceMotion
    });

    if (media && media.tagName === 'IFRAME') {
      // 内嵌页面与 PDF 自带交互，不套缩放控件，按舞台可用区铺满
      var controls = stage.querySelector('.hero-zoom');
      if (controls) controls.parentNode.removeChild(controls);
      stage.classList.remove('is-zoomed');
      // 灯箱里按原生尺寸铺满舞台：不缩放，页面自己按真实 CSS 像素排版。
      // 之前用 fitEmbedFrame 把逻辑宽锁在 1000px，宽屏上会把整页缩成中间一小块。
      media.style.transform = '';
      media.style.marginRight = '';
      media.style.marginBottom = '';
      delete media.dataset.fitScale;
      fillStageWithEmbed(stage, media);
    } else {
      invalidateHeroMetrics(stage);
      requestHeroMediaFit(stage, media);
      mountHeroZoomControls(stage);
    }

    var count = lightbox.querySelector('[data-lightbox="count"]');
    if (count) count.textContent = pad(lightboxState.index + 1) + ' / ' + pad(items.length);

    // 只有一张就没有翻页可言
    lightbox.querySelectorAll('.lightbox__nav').forEach(function (button) {
      button.hidden = items.length < 2;
    });

    lightbox.querySelectorAll('[data-lightbox-index]').forEach(function (button) {
      var isCurrent = parseInt(button.dataset.lightboxIndex, 10) === lightboxState.index;
      button.setAttribute('aria-current', String(isCurrent));
      if (isCurrent) {
        button.scrollIntoView({
          behavior: reduceMotion ? 'auto' : 'smooth',
          block: 'nearest',
          inline: 'nearest'
        });
      }
    });
  }

  function openLightbox(items, index, title, opener) {

    lightboxState.items = items.slice();
    lightboxState.title = title || '';
    lightboxState.opener = opener || null;
    // 展开起点用主图那个取景框：点哪张缩略图都从同一个窗口长出来、再收回同一个窗口。
    // 取不到就退回被点的那个元素。
    // 都要在锁滚动之前量——has-lightbox 会去掉滚动条，之后量到的位置会偏。
    var originSource = document.querySelector('.archive-detail.is-open .work__figure') || opener;
    lightboxState.originRect = originSource ? originSource.getBoundingClientRect() : null;

    // 压一条历史记录，让浏览器/手机的返回键先关灯箱而不是离开页面
    if (!lightboxHistoryEntry) {
      window.history.pushState({ lightbox: true }, '');
      lightboxHistoryEntry = true;

  function closeLightbox() {

    runLightboxTransition(false, function () {
      clearLightboxStage();

  function layoutMasonry(grid) {
    if (!grid || !grid.children.length || grid.clientWidth <= 0) return;
    var styles = window.getComputedStyle(grid);
    var columnCount = parseInt(styles.getPropertyValue('--masonry-columns'), 10) || 4;
    var visualGap = parseFloat(styles.columnGap) || 0;
    var columnWidth = (grid.clientWidth - visualGap * (columnCount - 1)) / columnCount;
    var columnHeights = Array(columnCount).fill(0);
    var items = Array.prototype.slice.call(grid.children);

    items.forEach(function (item) {
      item.style.width = columnWidth + 'px';
      item.style.gridRowEnd = '';
    });

    var layoutItems = items.map(function (item, sourceIndex) {
      return {
        item: item,
        sourceIndex: sourceIndex,
        height: item.getBoundingClientRect().height
      };
    }).sort(function (a, b) {
      return b.height - a.height || a.sourceIndex - b.sourceIndex;
    });

    layoutItems.forEach(function (entry) {
      var item = entry.item;
      var shortestHeight = Math.min.apply(Math, columnHeights);
      var columnIndex = columnHeights.indexOf(shortestHeight);
      var x = columnIndex * (columnWidth + visualGap);
      var y = shortestHeight;
      item.style.transform = 'translate3d(' + x + 'px, ' + y + 'px, 0)';
      columnHeights[columnIndex] = y + entry.height + visualGap;
    });

    grid.style.height = Math.max.apply(Math, columnHeights) - visualGap + 'px';
  }

  function requestMasonryLayout(grid) {
    if (!grid) return;
    window.cancelAnimationFrame(grid._masonryFrame || 0);
    window.clearTimeout(grid._masonryTimer || 0);
    grid._masonryFrame = window.requestAnimationFrame(function () {
      grid._masonryFrame = window.requestAnimationFrame(function () {
        layoutMasonry(grid);
        grid._masonryFrame = 0;
      });
    });
    grid._masonryTimer = window.setTimeout(function () {
      layoutMasonry(grid);
      grid._masonryTimer = 0;
    }, 760);
  }

  function bindMasonryMedia(grid, media) {
    if (!grid || !media) return;
    var relayout = function () { requestMasonryLayout(grid); };
    if (media.tagName === 'VIDEO') media.addEventListener('loadedmetadata', relayout, { once: true });
    else media.addEventListener('load', relayout, { once: true });
    requestMasonryLayout(grid);
  }

  function layoutVisibleMasonry() {
    document.querySelectorAll('.archive-detail.is-open .work__thumbs').forEach(requestMasonryLayout);
  }

  window.addEventListener('resize', layoutVisibleMasonry);

  // About 数据里仍有占位文本时，不把它暴露给访客；可靠字段才进入首屏。
  function profileText(value) {

  function setArchiveState(item, isOpen) {
    var trigger = item.querySelector('button.archive-row');
    var detail = trigger ? item.ownerDocument.getElementById(trigger.getAttribute('aria-controls')) : null;
    item.classList.toggle('is-open', isOpen);
    if (!isOpen) {

    var hasOpenProject = !!indexHost.querySelector('.archive-project.is-open:not([hidden])');
    if (indexSection) indexSection.classList.toggle('has-open-project', hasOpenProject);
    if (archiveFrame) archiveFrame.classList.toggle('has-open-project', hasOpenProject);

  function cancelArchiveAlignment(indexHost) {
    var archiveFrame = indexHost ? indexHost.closest('.frame--archive') : null;
    if (!archiveFrame || !archiveFrame._archiveAlignmentFrame) return;
    window.cancelAnimationFrame(archiveFrame._archiveAlignmentFrame);
    archiveFrame._archiveAlignmentFrame = 0;
  }

  function alignArchiveWorkspace(indexHost) {
    var indexSection = indexHost ? indexHost.closest('.archive-index-section') : null;
    var archiveFrame = indexHost ? indexHost.closest('.frame--archive') : null;
    if (!indexSection || !archiveFrame) return;

    cancelArchiveAlignment(indexHost);
    if (reduceMotion) {
      indexSection.scrollIntoView({ behavior: 'auto', block: 'start' });
      return;
    }

    var startY = window.scrollY || window.pageYOffset || 0;
    var startTime = null;
    var duration = 720;

    function step(timestamp) {
      if (startTime === null) startTime = typeof timestamp === 'number' ? timestamp : 0;
      var progress = typeof timestamp === 'number'
        ? Math.min(1, (timestamp - startTime) / duration)
        : 1;
      var eased = 1 - Math.pow(1 - progress, 4);
      var targetY = (window.scrollY || window.pageYOffset || 0) + indexSection.getBoundingClientRect().top;
      window.scrollTo(0, startY + (targetY - startY) * eased);

      if (progress < 1) archiveFrame._archiveAlignmentFrame = window.requestAnimationFrame(step);
      else archiveFrame._archiveAlignmentFrame = 0;
    }

    archiveFrame._archiveAlignmentFrame = window.requestAnimationFrame(step);
  }

  function pinArchiveWorkspaceTop(indexSection) {
    if (!indexSection) return;
    var sectionTop = indexSection.getBoundingClientRect().top;
    if (Math.abs(sectionTop) < 0.5) return;
    window.scrollTo(0, (window.scrollY || window.pageYOffset || 0) + sectionTop);
  }

  function collapseArchiveWorkspace(indexHost, returnToFrameTop) {

    indexHost.querySelectorAll('.archive-project').forEach(function (item) {

    syncArchiveLayout(indexHost);
    if (returnToFrameTop && archiveFrame) {
      archiveFrame.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
    }
  }

  function expandArchiveWorkspace(indexHost) {

    var item = indexHost._lastArchiveProject || indexHost.querySelector('.archive-project:not([hidden])');
    if (!item || item.hidden) item = indexHost.querySelector('.archive-project:not([hidden])');
    if (!item) return false;

    indexHost.querySelectorAll('.archive-project').forEach(function (current) {
      setArchiveState(current, current === item);

    syncArchiveLayout(indexHost);

  function projectCareerTracks(project) {

  // ---------- 行悬停预览：抽屉式，插进被悬停的行下方，把后续行挤开 ----------
  // 全局只有一块预览板，随悬停在行之间搬家；挂在 frame 上复用
  function ensureArchivePeek(frame) {
    if (frame._peek) return frame._peek;
    var panel = archiveNode('div', 'archive-peek');
    panel.setAttribute('aria-hidden', 'true');
    var clip = archiveNode('div', 'archive-peek__clip');
    var body = archiveNode('div', 'archive-peek__body');
    var strip = archiveNode('div', 'archive-peek__strip');
    var reel = archiveNode('div', 'archive-peek__reel');
    strip.appendChild(reel);
    var caption = archiveNode('div', 'archive-peek__caption');
    var titleEl = archiveNode('span', 't');
    var countEl = archiveNode('span', 'c');
    caption.appendChild(titleEl);
    caption.appendChild(countEl);
    body.appendChild(strip);
    body.appendChild(caption);
    clip.appendChild(body);
    panel.appendChild(clip);

    var peek = {
      timer: 0,
      raf: 0,
      setWidth: 0,   // 一组胶片的宽度（图宽和 + 组内间隙）
      pos: 0,
      lastTime: 0,
      stopReel: function () {
        if (peek.raf) window.cancelAnimationFrame(peek.raf);
        peek.raf = 0;
        peek.pos = 0;
        peek.lastTime = 0;
        reel.style.transform = '';
      },
      hide: function () {
        window.clearTimeout(peek.timer);
        peek.timer = 0;
        peek.stopReel();
        panel.classList.remove('is-open');
      },
      // 传送带：40px/s 匀速左移，走完一组无缝回卷
      startReel: function () {
        function step(ts) {
          if (!peek.lastTime) peek.lastTime = ts;
          var dt = Math.min(64, ts - peek.lastTime);
          peek.lastTime = ts;
          peek.pos -= dt * 0.04;
          var loop = peek.setWidth + 10;   // 组宽 + 组间间隙
          if (peek.setWidth > 0 && -peek.pos >= loop) peek.pos += loop;
          reel.style.transform = 'translateX(' + peek.pos.toFixed(1) + 'px)';
          peek.raf = window.requestAnimationFrame(step);
        }
        peek.raf = window.requestAnimationFrame(step);
      },
      show: function (item, media, title) {
        peek.stopReel();
        titleEl.textContent = title;
        countEl.textContent = pad(media.length) + (media.length === 1 ? ' FRAME' : ' FRAMES');
        // 重建胶片：单图居中不滚；多图复制一组做无缝循环
        reel.textContent = '';
        reel.classList.toggle('is-single', media.length === 1);
        var firstSet = [];
        function addImg(src) {
          var im = document.createElement('img');
          im.alt = '';
          im.decoding = 'async';
          im.src = src;
          reel.appendChild(im);
          return im;
        }
        media.forEach(function (src) { firstSet.push(addImg(src)); });
        peek.setWidth = 0;
        function measure() {
          var w = 0;
          firstSet.forEach(function (im, i) { w += im.offsetWidth + (i ? 10 : 0); });
          peek.setWidth = w;
        }
        if (media.length > 1) {
          media.forEach(addImg);   // 第二组，回卷衔接用
          firstSet.forEach(function (im) { im.addEventListener('load', measure); });
          measure();
        }
        // 搬进被悬停的行条目里（按钮之后），后续行被自然推开
        if (panel.parentNode !== item) {
          panel.classList.remove('is-open');
          item.appendChild(panel);
          // 下一帧再展开，让 0fr→1fr 的过渡生效
          window.requestAnimationFrame(function () { panel.classList.add('is-open'); });
        } else {
          panel.classList.add('is-open');
        }
        if (media.length > 1 && !reduceMotion) peek.startReel();
      }
    };
    frame._peek = peek;
    return peek;
  }

  function buildArchiveProject(indexHost, workspace, project, position) {
    var number = pad(position + 1);
    var track = trackById[project.primary_track] || {};
    var careerTracks = projectCareerTracks(project);
    var item = archiveNode('article', 'archive-project');
    var trigger = archiveNode('button', 'archive-row');
    var detail = archiveNode('div', 'archive-detail');
    var clip = archiveNode('div', 'archive-detail__clip');
    var category = archiveNode('span', 'archive-row__category');
    var triggerId = 'archive-trigger-' + number;
    var panelId = 'archive-panel-' + number;

    item.dataset.primaryTrack = project.primary_track || '';
    item.dataset.tracks = (project.tracks || []).join(' ');
    trigger.type = 'button';
    trigger.id = triggerId;
    trigger.setAttribute('aria-expanded', 'false');
    trigger.setAttribute('aria-controls', panelId);
    if (track.color) trigger.style.setProperty('--project-track-color', track.color);

    if (careerTracks.length) {
      category.setAttribute('aria-label', 'Career directions: ' + careerTracks.map(function (careerTrack) {
        return careerTrack.label;
      }).join(', '));
      careerTracks.forEach(function (careerTrack) {
        var label = archiveNode('span', 'archive-row__track-label', careerTrack.short_label || careerTrack.label);
        if (careerTrack.color) label.style.setProperty('--track-color', careerTrack.color);
        category.appendChild(label);

    } else {
      var fallbackLabel = archiveNode('span', 'archive-row__track-label', project.type || 'Unclassified');

    // ---------- 多边形工具 ----------
    function polyArea(poly) {

    }
    function polyCentroid(poly) {

      for (var i = 0; i < poly.length; i++) {

        if (aIn !== bIn) {

    }
    function pointInPoly(pt, poly) {

    // 区间减法：从一段墙里抠掉若干洞
    function subtractSpan(span, holes) {

          if (hole[1] <= a || hole[0] >= b) { next.push(part); return; }

    function repaintShape(shape) {

      for (var i = 0; i < pts.length; i++) parts.push(sketchSegmentLabel(pts[i], pts[(i + 1) % pts.length]));

      (shape.holes || []).forEach(function (hole) {

        hole.forEach(function (pt) { parts.push(sketchVertex(pt, false)); });

      if (sketchPaper) {

    // 打开项目时由 syncArchiveLayout 调用：放弃草稿/测距/移动，收起菜单（形保留）
    cancelArchiveSketch = function () {
